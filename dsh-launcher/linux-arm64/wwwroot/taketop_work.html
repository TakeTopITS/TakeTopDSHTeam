<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>TakeTopDshTeam</title>
<style>html.tt-boot body { visibility: hidden; }</style>
<script>
// Do not paint until the saved language is known: the bar and the waiting text would
// otherwise show the default language first and switch a moment later.
(function () {
  var root = document.documentElement;
  try {
    root.classList.add('tt-boot');
    var m = document.cookie.match(/(?:^|;\s*)tt_lang=([^;]+)/);
    var l = m ? decodeURIComponent(m[1]) : '';
    if (!l) { try { l = localStorage.getItem('tt_lang') || ''; } catch (e) { } }
    if (l) root.lang = l;
  } catch (e) { }
  setTimeout(function () { try { root.classList.remove('tt-boot'); } catch (e) { } }, 3000);
})();
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #e9ebef; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #ffffff; border-bottom: 1px solid #d5d9df; }
  .bar a { color: #2563eb; text-decoration: none; font-size: 14px; font-weight: 600; }
  .bar a:hover { text-decoration: underline; }
  .bar .title { font-weight: 600; font-size: 15px; color: #1c1e21; }
  .bar .spacer { flex: 1; }
  .bar select { padding: 5px 8px; border: 1px solid #c8ccd2; border-radius: 6px; font-size: 13px; background: #fff; }
  .bar .set { padding: 5px 9px; border: 1px solid #c8ccd2; border-radius: 6px; background: #fff; font-size: 14px; line-height: 1; cursor: pointer; }
  .bar .set:hover { background: #f1f5f9; }
  /* Waiting layer shown while the member's service is still starting. */
  .boot { position: fixed; inset: 0; z-index: 90; background: rgba(255,255,255,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: system-ui, sans-serif; }
  .boot .spin { width: 46px; height: 46px; border: 5px solid #e2e6ec; border-top-color: #2563eb; border-radius: 50%; animation: bootspin 1s linear infinite; }
  .boot .txt { color: #4b5563; font-size: 15px; }
  @keyframes bootspin { to { transform: rotate(360deg); } }
  .split { flex: 1; display: flex; min-height: 0; position: relative; }
  .pane { border: 0; }
  .pane.fm { width: 30%; min-width: 220px; max-width: 70%; background: #f5f6f8; }
  .pane.dsh { flex: 1; background: #fff; }
   .splitter { flex: 0 0 6px; cursor: col-resize; background: transparent; background-clip: padding-box; position: relative; z-index: 5; }
   .splitter:hover, .splitter.dragging { background: #c8ccd2; }
   .splitter::after { content: ""; position: absolute; inset: 0; margin: 0 -8px; }
   .splitter.dragging { background: #2563eb; }
   .split-arrow { position: absolute; top: 2px; left: -14px; z-index: 10; padding: 2px 4px; border: 1px solid #e5e7eb; border-radius: 3px; background: #f9fafb; color: #6b7280; font-size: 11px; line-height: 1; cursor: pointer; pointer-events: auto; white-space: nowrap; }
</style>
</head>
<body>
  <div class="bar">
    <!-- Left empty on purpose: applyWorkbarLang() fills these from the chosen language. -->
    <a href="/admin" id="backLink"></a>
    <span class="title" id="workTitle"></span>
    <span class="spacer"></span>
    <button id="settingsBtn" class="set" title="">⚙</button>
    <select id="workLang">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="split" id="split">
    <iframe class="pane fm" id="fmPane" title=""></iframe>
    <div class="splitter" id="splitter" title=""><button id="expandBtn" class="split-arrow" title="">▶▶</button></div>
    <iframe class="pane dsh" id="dshPane" title="DSH"></iframe>
  </div>
  <div class="boot" id="bootMask">
    <div class="spin"></div>
    <div class="txt" id="bootTxt"></div>
  </div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var inst = q.get('inst') || '';
  var token = q.get('launcher_token') || '';
  var proto = location.protocol + '//' + location.host;

  // Left: file manager (standalone fm page, same-origin). Right: DSH through the
  // launcher proxy so it stays same-origin and gets the language injected. When
  // ?inst is absent, the right pane opens the viewer's own/default instance.
  // Both panes carry the launcher_token so they authenticate even without a
  // session cookie (e.g. when the workbench was opened via a token URL).
  var fmSrc = proto + '/fm'
    + (inst ? '?inst=' + encodeURIComponent(inst) : '')
    + (token ? ((inst ? '&' : '?') + 'launcher_token=' + encodeURIComponent(token)) : '');
  var dshSrc = proto + '/'
    + (inst ? '?inst=' + encodeURIComponent(inst) : '')
    + (token ? ((inst ? '&' : '?') + 'launcher_token=' + encodeURIComponent(token)) : '');
  document.getElementById('fmPane').src = fmSrc;
  document.getElementById('dshPane').src = dshSrc;
  document.getElementById('dshPane').onload = function() { applyWorkbarLang(); };

  // Localize the top bar (back link + title) to match the chosen language.
  function currentLang() {
    try {
      var m = document.cookie.match(/(?:^|;\s*)tt_lang=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
    } catch (e) {}
    try { var ls = localStorage.getItem('tt_lang'); if (ls) return ls; } catch (e) {}
    return 'zh';
  }
  function applyWorkbarLang() {
    var c = String(currentLang() || '').toLowerCase();
    var zh = (c === 'zh' || c === 'zh-cn' || c === 'zhcn' || c === 'cn');
    document.getElementById('backLink').textContent = zh ? '← 返回管理页' : '← Back to Admin';
    // Workspace · <current user> [· <instance> when it is someone else's].
    var bits = zh ? ['工作台'] : ['Workspace'];
    if (meLabel) bits.push(meLabel);
    if (inst && inst.toLowerCase() !== String(meCode || '').toLowerCase()) bits.push(inst);
    var titleText = bits.join(' · ');
    document.getElementById('workTitle').textContent = titleText;
    desiredTitle = 'TakeTopDshTeam - ' + titleText;
    document.title = desiredTitle;
    try { history.replaceState(history.state, desiredTitle); } catch(e) {}
    document.getElementById('fmPane').title = zh ? '文件管理' : 'File Manager';
    document.getElementById('splitter').title = zh ? '拖动调整栏宽' : 'Drag to resize';
    var sb = document.getElementById('settingsBtn');
    if (sb) sb.title = zh ? '设置' : 'Settings';
    var eb = document.getElementById('expandBtn');
    if (eb) eb.title = zh ? '放大/缩小' : 'Expand / restore';
  }
  // Who am I? Show the signed-in user's name in the header title.
  var meCode = '', meName = '', meLabel = '';
  try {
    var u = '/api/auth/me' + (token ? '?launcher_token=' + encodeURIComponent(token) : '');
    fetch(u, { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        // The standard edition's /api/auth/me answers with username (no userCode).
        meCode = String(d.userCode || d.username || ''); meName = String(d.userName || d.name || '');
        meLabel = meName || meCode;
        if (meLabel) applyWorkbarLang();
      }).catch(function () { });
  } catch (e) { }  var desiredTitle = '';
  applyWorkbarLang();
  // Lock document.title setter so DSH iframe (same-origin) cannot override the tab title
  try {
    var _p = HTMLDocument.prototype;
    var _d = Object.getOwnPropertyDescriptor(_p, 'title');
    if (_d && _d.set) {
      Object.defineProperty(_p, 'title', {
        configurable: true,
        enumerable: true,
        get: _d.get,
        set: function() { /* blocked */ }
      });
    }
  } catch(e) {}
  setInterval(function() {
    applyWorkbarLang();
    // Use DOM directly since document.title setter is now blocked
    var t = document.querySelector('title');
    if (t) t.textContent = desiredTitle;
  }, 100);

  // ---- resizable splitter (smooth: rAF-throttled, iframes lose pointer-events
  //      while dragging so the parent window keeps receiving mousemove) ----
  var split = document.getElementById('split');
  var fm = document.getElementById('fmPane');
  var dsh = document.getElementById('dshPane');
  var splitter = document.getElementById('splitter');
  var rafId = 0;
  function setFmWidth(pct) {
    pct = Math.max(15, Math.min(70, pct));   // clamp 15%..70%
    fm.style.width = pct + '%';
    try { localStorage.setItem('fm_width', pct); } catch (e) {}
  }
  try { var savedW = parseFloat(localStorage.getItem('fm_width')); if (savedW) setFmWidth(savedW); } catch (e) {}

  // Toggle the left pane between ~30% and ~70% (enlarge / restore).
  var expandBtn = document.getElementById('expandBtn');
  function updateExpandIcon() {
    var curW = parseFloat(fm.style.width) || parseFloat(localStorage.getItem('fm_width')) || 30;
    expandBtn.textContent = curW < 50 ? '▶▶' : '◀◀';
  }
  updateExpandIcon();
  // Let the embedded /fm page widen the left pane (e.g. when Task Management is
  // opened) so the tasks tables have more room...
  window.ttExpandLeft = function () { setFmWidth(70); updateExpandIcon(); };
  // ...and put it back to the standard 30% when that page returns to its file list.
  // Only the >30% case is corrected: a deliberately narrow pane is left alone.
  function collapseLeftIfWide() {
    var curW = parseFloat(fm.style.width) || parseFloat(localStorage.getItem('fm_width')) || 30;
    if (curW > 30) { setFmWidth(30); updateExpandIcon(); }
  }
  window.ttCollapseLeft = collapseLeftIfWide;

  // A file preview opens as a position:fixed overlay INSIDE the left pane (the
  // iframe), so it never exceeds the pane. When one opens, widen the pane to 70%
  // so the preview has room.
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'tt-viewer' && d.open) { setFmWidth(70); updateExpandIcon(); }
  });
  expandBtn.onclick = function (ev) {
    ev.stopPropagation();
    var curW = parseFloat(fm.style.width) || parseFloat(localStorage.getItem('fm_width')) || 30;
    setFmWidth(curW < 50 ? 70 : 30);
    updateExpandIcon();
  };

  splitter.addEventListener('mousedown', function (ev) {
    ev.preventDefault();
    var startX = ev.clientX;
    var startW = fm.getBoundingClientRect().width;
    var totalW = split.getBoundingClientRect().width || 1;
    splitter.classList.add('dragging');
    // Let the parent document see every mouse move even over the iframes.
    fm.style.pointerEvents = 'none';
    dsh.style.pointerEvents = 'none';
    var pending = null;
    function scheduleMove(me) {
      pending = startW + (me.clientX - startX);
      if (rafId) return;
      rafId = requestAnimationFrame(function () {
        rafId = 0;
        setFmWidth((pending || 0) / totalW * 100);
      });
    }
    function onMove(me) { scheduleMove(me); }
    function onUp() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      splitter.classList.remove('dragging');
      fm.style.pointerEvents = '';
      dsh.style.pointerEvents = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  });

  // Keep the chosen language in sync across both panes via the shared tt_lang cookie.
  var sel = document.getElementById('workLang');
  function dropdownLang(code) {
    var c = String(code || '').toLowerCase();
    return (c === 'en' || c === 'en-us' || c === 'en-gb' || c === 'us') ? 'en' : 'zh';
  }
  // Normalize to a valid <option value> ('en'/'zh'); the stored code may be 'zh-cn'
  // which has no matching option, leaving the select blank. Default to 'zh'.
  sel.value = dropdownLang(currentLang());
  // Force an iframe to reload (src unchanged would NOT reload).
  function reloadPane(id, url) {
    var f = document.getElementById(id);
    f.src = 'about:blank';
    // A cache-busting token guarantees a fresh load even for identical URLs.
    (function () { setTimeout(function () { f.src = url; }, 0); })();
  }
  sel.onchange = function () {
    try { localStorage.setItem('tt_lang', sel.value); document.cookie = 'tt_lang=' + sel.value + '; path=/; max-age=31536000; SameSite=Lax'; } catch (e) {}
    applyWorkbarLang();
    var bust = '&_ts=' + Date.now();
    reloadPane('fmPane', fmSrc + (fmSrc.indexOf('?') >= 0 ? bust : '?' + bust.slice(1)));
    reloadPane('dshPane', dshSrc + (dshSrc.indexOf('?') >= 0 ? bust : '?' + bust.slice(1)));
  };

  // The standard edition has no ttApi helper: append the token the same way the pane
  // URLs do, so these calls authenticate even without a session cookie.
  function ttu(u) {
    return u + (token ? ((u.indexOf('?') >= 0 ? '&' : '?') + 'launcher_token=' + encodeURIComponent(token)) : '');
  }
  function bootZh() {
    var c = String(currentLang() || '').toLowerCase();
    return (c === 'zh' || c === 'zh-cn' || c === 'zhcn' || c === 'cn');
  }
  function bootLabel(secs) {
    var s = secs > 0 ? (bootZh() ? ('（已等待 ' + secs + ' 秒）') : (' (' + secs + 's)')) : '';
    bootTxt.textContent = (bootZh()
      ? '首次启动服务，最多需要 1 分钟，请稍候…'
      : 'Starting the service - this can take up to a minute, please wait\u2026') + s;
  }
  function bootSlowLabel(secs) {
    bootTxt.innerHTML = (bootZh() ? '启动超时，可到 ' : 'Taking longer than expected. Open ')
      + '<a href="/admin" style="color:#2563eb;">' + (bootZh() ? '管理页面' : 'the management page') + '</a>'
      + (bootZh() ? ' 手动启动或查看状态。' : ' to start it or check its status.')
      + (secs > 0 ? (bootZh() ? ('（已等待 ' + secs + ' 秒）') : (' (' + secs + 's)')) : '');
  }
  function bootHide() { if (bootMask) bootMask.style.display = 'none'; }
  // Reload once using a URL marker: unlike sessionStorage it survives a reload, so this
  // can never turn into a refresh loop.
  function bootReloadOnce(marker) {
    var href = location.href.split('#')[0];
    var re = new RegExp('([?&])' + marker + '=1');
    if (re.test(href)) return;
    location.href = href + (href.indexOf('?') >= 0 ? '&' : '?') + marker + '=1';
  }

  // ---- settings button: back to the management page --------------------------------
  var setBtn = document.getElementById('settingsBtn');
  if (setBtn) setBtn.onclick = function () { location.href = '/admin'; };

  // ---- waiting layer: start the instance, then open the workbench ------------------
  var bootMask = document.getElementById('bootMask');
  var bootTxt = document.getElementById('bootTxt');
  var bootTries = 0, bootAskedAt = 0, bootSawDown = false, bootSlow = false;
  function bootCheck() {
    bootTries++;
    if (!bootMask || bootMask.style.display === 'none') return;
    // (bootSawDown is set below, only when the launcher reports running:false)
    var secs = (bootTries - 1) * 3;
    if (bootTries >= 20) bootSlow = true;
    if (bootSlow) bootSlowLabel(secs); else bootLabel(secs);
    // Match the instance by id OR name (the URL may carry a member name), the same way
    // the management page lists them.
    var want = String(inst || meCode || '').toLowerCase();
    fetch(ttu('/api/instances'), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var list = (j && j.instances) || [], mine = null;
        for (var i = 0; i < list.length; i++) {
          var it = list[i];
          if (String(it.id || '').toLowerCase() === want ||
              String(it.name || '').toLowerCase() === want ||
              String(it.userName || '').toLowerCase() === want) { mine = it; break; }
        }
        try { console.log('[boot]', bootTries, 'inst=' + inst, mine ? JSON.stringify({ id: mine.id, running: mine.running }) : 'not-found'); } catch (e) { }
        if (!mine) { if (!inst) bootHide(); return; }
        // Only refresh the workbench for an instance we actually had to start: refreshing
        // on "we waited a tick" made an already-running instance reload the page ~3s after
        // it had opened - the extra flash after the workspace was already up.
        if (!mine.running) bootSawDown = true;
        if (mine.running) { bootHide(); if (bootSawDown) bootReloadOnce('ttboot'); return; }
        // Start it once, then at most every 15s - a tight repeat loop kept instances
        // that used to come up from ever reaching Running.
        var now = Date.now();
        if (bootAskedAt && (now - bootAskedAt) < 15000) return;
        bootAskedAt = now;
        fetch(ttu('/api/instances/' + encodeURIComponent(mine.id) + '/start'), { method: 'POST', credentials: 'same-origin' })
          .then(function (r) {
            try { console.log('[boot] start', mine.id, '-> HTTP', r.status); } catch (e) { }
            if (!r.ok) return;
            bootHide();
            bootReloadOnce('ttboot');   // started: open the workbench (marker prevents loops)
          })
          .catch(function () { });
      })
      .catch(function () { });
  }
  setTimeout(bootCheck, 300);
  setInterval(bootCheck, 3000);

  // The DSH pane can come back empty on the very first open after a restart: the instance
  // process is already "running" but its web service is not serving yet, so the iframe loads
  // a not-ready page. Reload ONLY the pane a couple of times (bounded, in sessionStorage, so
  // it can never loop). No overlay, no workspace logic touched.
  (function () {
    var el = document.getElementById('dshPane');
    if (!el) return;
    var key = 'ttDshRetry:' + String(inst || location.pathname);
    function looksEmpty() {
      try {
        var d = el.contentDocument;
        if (!d || !d.body) return true;
        var t = (d.body.innerText || '');
        // Not-ready pages count as empty too: the launcher answers these while the
        // instance is still starting, and they carry text/buttons so a plain text
        // check misses them.
        if (t.indexOf('实例未运行') >= 0 || t.indexOf('Instance is not running') >= 0 || t.indexOf('DSH is starting') >= 0 || t.indexOf('DSH 正在启动') >= 0 || (d.body.innerHTML || '').indexOf('ttStartTry') >= 0) return true;
        t = t.trim();
        return t.length < 40 && !d.querySelector('[contenteditable="true"],[role="textbox"],textarea,button');
      } catch (e) { return false; }
    }
    var n = 0;
    var iv = setInterval(function () {
      n++;
      if (n > 14) { clearInterval(iv); try { sessionStorage.removeItem(key); } catch (e) { } return; }
      if (!looksEmpty()) { clearInterval(iv); try { sessionStorage.removeItem(key); } catch (e) { } return; }
      var tries = 0; try { tries = parseInt(sessionStorage.getItem(key) || '0', 10) || 0; } catch (e) { }
      if (tries >= 3) return;
      try { sessionStorage.setItem(key, String(tries + 1)); } catch (e) { }
      // Full page reload, not just the pane: the launcher_token in this page URL is minted
      // per page load, so it goes stale when the launcher restarts - a full reload is
      // exactly the manual refresh that always fixed this. Bounded by the counter above.
      // Reload ONLY the DSH pane - never the whole page.
      // Reload the pane WITHOUT touching its URL: the launcher forwards this URL upstream
      // verbatim and DSH matches its bundle route exactly, so a cache-buster query
      // (&_ttr=...) made the pane 404 -> blank. A same-URL reload is what we want.
      try { el.contentWindow.location.reload(); }
      catch (e) { try { el.src = el.getAttribute('src') || el.src; } catch (e2) { } }
    }, 3000);
  })();

  // ---- "this member has no workspace record yet" hint + auto-refresh ---------------
  var wsHintShown = false, wsReloaded = false, wsHits = 0;
  function wsHintCheck() {
    var doc = null;
    try { doc = document.getElementById('dshPane').contentDocument; } catch (e) { }
    var txt = '';
    try { txt = (doc && doc.body) ? (doc.body.innerText || '') : ''; } catch (e) { }
    var needs = txt.indexOf('Choose a workspace') >= 0 || txt.indexOf('\u9009\u62e9\u5de5\u4f5c\u533a') >= 0
      || txt.indexOf('Create workspace') >= 0 || txt.indexOf('\u521b\u5efa\u5de5\u4f5c\u533a') >= 0;
    var el = document.getElementById('wsHint');
    if (!needs) {
      wsHits = 0;
      if (el) el.style.display = 'none';
      if (wsHintShown && !wsReloaded) { wsReloaded = true; bootReloadOnce('ttws'); }
      return;
    }
    // Only believe it after it stays true for a LONG time: the words "Create workspace"
    // (and their Chinese form) appear TRANSIENTLY while the DSH boots, and treating that
    // as "no workspace record" made the page reload itself right after the workspace was
    // selected - the single flash the user saw. The launcher now preselects + injects the
    // session, so a normal boot clears the hero well before this threshold (8 checks,
    // ~25s); only a member who is GENUINELY stuck on the hero reaches it.
    wsHits++;
    if (wsHits < 8 && !wsHintShown) return;
    wsHintShown = true;
    if (!el) {
      el = document.createElement('div');
      el.id = 'wsHint';
      el.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:95;max-width:min(92vw,780px);'
        + 'background:#fffbeb;color:#92400e;border:1px solid #fcd34d;border-radius:10px;padding:9px 32px 9px 13px;'
        + 'font:14px/1.55 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.12);white-space:pre-wrap';
      var x = document.createElement('span');
      x.textContent = '\u2715';
      x.style.cssText = 'position:absolute;right:8px;top:5px;cursor:pointer;font-weight:700';
      x.onclick = function () { el.style.display = 'none'; };
      el.appendChild(x);
      document.body.appendChild(el);
    }
    el.firstChild.nodeValue = bootZh()
      ? '这个成员还没有工作区记录：请在右上角「选择工作区 / 创建工作区」里点“创建工作区”，创建后会自动进入。'
      : 'This member has no workspace record yet: click "Create workspace" ("Choose workspace", top right) - you will enter automatically.';
    el.style.display = '';
  }
  setInterval(wsHintCheck, 3000);
  setTimeout(wsHintCheck, 1500);

  // Everything above ran (language applied, waiting text localized): show the page.
  bootLabel(0);
  try { document.documentElement.classList.remove('tt-boot'); } catch (e) { }
})();
</script>
</body>
</html>
