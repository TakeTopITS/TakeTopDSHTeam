<style>

  button { padding: 7px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }

  button.secondary { background: #64748b; }
  button.danger { background: #dc2626; }
  .table-wrap { background: #fff; border: 1px solid #e0e2e6; border-radius: 8px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid #eef0f3; text-align: left; vertical-align: top; }
  th { background: #f8fafc; font-weight: 700; color: #475569; position: sticky; top: 0; }
  .st { font-weight: 600; }
  .st.processing { color: #d97706; }
  .st.done { color: #16a34a; }
  .st.cancelled { color: #9ca3af; }
  .st.pending { color: #64748b; }
  .task-name-link { color:#2563eb; text-decoration:none; font-weight:600; }
  .task-name-link:hover { text-decoration:underline; }
  .row-ops { white-space: nowrap; }
  .row-ops button { padding: 3px 9px; font-size: 12px; white-space: nowrap; }
  .row-ops button + button { margin-left: 5px; }
  .files-list { list-style: none; margin: 0; padding: 0; }
  .files-list li { font-size: 12.5px; color: #334155; line-height: 1.7; }
  .muted { color: #6b7280; font-size: 13px; }
  .empty { padding: 24px; text-align: center; color: #9ca3af; font-size: 14px; }
  .tt-pager { display:flex; align-items:center; justify-content:center; gap:4px; padding:8px 0; }
  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 10005; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 10px; width: min(560px,94vw); max-height: 90vh; padding: 20px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: auto; }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .modal .field { margin-bottom: 12px; }
  .modal label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 7px 9px; border: 1px solid #c8ccd2; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
  .modal textarea { min-height: 84px; resize: vertical; }
  .modal .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .modal .chip { background: #eef1f5; border-radius: 14px; padding: 3px 10px; font-size: 12.5px; color: #334155; display: inline-flex; align-items: center; gap: 6px; }
  .modal .chip b { cursor: pointer; color: #dc2626; }
  [contenteditable] img { max-width: 100%; height: auto; }
  [contenteditable]:focus { outline: 2px solid #93c5fd; }
  .rich-toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; border: 1px solid #d5d9df; border-radius: 7px; padding: 4px; background: #f8fafc; }

<script>
(function () {
  var I18N = {
    zh: {
      back:"← 返回", title:"任务分配", members:"成员", add:"添加任务", cur:"当前成员：",
      thSeq:"序号", thType:"任务类型", thName:"任务名称", thCreator:"创建者", thAssigned:"分派时间", thStatus:"状态", thFiles:"相关文件", thAssign:"继续分派", thAssignee:"受理人", thOps:"操作",
      edit:"编辑", del:"删除", feedback:"反馈", fbContent:"反馈内容", fbRecord:"反馈记录", fbNo:"序号", fbBy:"反馈人", fbTime:"时间", fbFiles:"附件", fbEmpty:"暂无反馈", fbRequired:"请填写反馈内容", empty:"暂无任务", modalAdd:"添加任务", modalEdit:"编辑任务",
      lblType:"任务类型", lblName:"任务名称", lblContent:"任务内容", lblAssigned:"分派时间", lblStatus:"状态", lblFiles:"相关文件（可多选）", lblAssignee:"受理人",
      selectType:"-- 选择类型 --", addTypeTip:"输入新类型名称：",
      subTasks:"子任务", noSubTasks:"（无子任务）", expand:"展开子任务", collapse:"收起子任务",
      save:"保存", cancel:"取消", confirmDel:"确定删除该任务？", delMsg:"（已删除）", close:"关闭", fileAskDownload:"该类型文件无法预览，是否下载",
      saveOk:"保存成功", saveFail:"保存失败", saveDone:"正在保存...",
      st:{processing:"处理中", done:"完成", cancelled:"取消", pending:"待处理"},
      errLoad:"加载失败：", errSave:"保存失败", errUpload:"上传失败"
    },
    en: {
      back:"← Back", title:"Task Assignment", members:"Members", add:"Add Task", cur:"Current member: ",
      thSeq:"No.", thType:"Type", thName:"Name", thCreator:"Created By", thAssigned:"Assigned At", thContent:"Content", thStatus:"Status", thFiles:"Files", thAssign:"Continue Assign", thAssignee:"Assignee", thOps:"Actions",
      edit:"Edit", del:"Delete", feedback:"Feedback", fbContent:"Content", fbRecord:"Feedback records", fbNo:"No.", fbBy:"By", fbTime:"Time", fbFiles:"Files", fbEmpty:"No feedback yet", fbRequired:"Please enter feedback", empty:"No tasks", modalAdd:"Add Task", modalEdit:"Edit Task",
      lblType:"Type", lblName:"Name", lblContent:"Content", lblAssigned:"Assigned At", lblStatus:"Status", lblFiles:"Files (multi-select)", lblAssignee:"Assignee",
      selectType:"-- Select type --", addTypeTip:"Enter new type name:",
      subTasks:"Subtasks", noSubTasks:"(no subtasks)", expand:"Expand subtasks", collapse:"Collapse subtasks",
      save:"Save", cancel:"Cancel", confirmDel:"Delete this task?", delMsg:"(deleted)", close:"Close", fileAskDownload:"This file type can't be previewed. Download it?",
      saveOk:"Saved successfully", saveFail:"Save failed", saveDone:"Saving...",
      st:{processing:"Processing", done:"Done", cancelled:"Cancelled", pending:"Pending"},
      errLoad:"Load failed: ", errSave:"Save failed", errUpload:"Upload failed"
    }
  };
  var lang = 'zh';
  var launcherToken = (function(){ try { return new URLSearchParams(location.search).get('launcher_token'); } catch(e){ return null; } })();
  function withToken(u){ if(launcherToken && /\/api\/(files|feedback)/.test(u)){ u += (u.indexOf('?') >= 0 ? '&' : '?') + 'launcher_token=' + encodeURIComponent(launcherToken); } return u; }
  function norm(c){var x=String(c||'').toLowerCase();return (x==='en'||x==='en-us'||x==='en-gb'||x==='us')?'en':'zh';}
  function curLang(){try{var m=document.cookie.match(/(?:^|;\s*)tt_lang=([^;]+)/);if(m)return decodeURIComponent(m[1]);}catch(e){}try{var l=localStorage.getItem('tt_lang');if(l)return l;}catch(e){}return 'zh';}
  lang = norm(curLang());
  function t(k){ if(k==='st') return I18N[lang].st; return I18N[lang][k] || I18N.zh[k] || k; }
  function applyBar(){
    $('#pageTitle').textContent = t('title');
    $('#backLink').textContent = t('back');
    $('#memberTitle').textContent = t('members');
    $('#addTaskBtn').textContent = t('add');
    $('#thSeq').textContent = t('thSeq'); $('#thType').textContent = t('thType'); $('#thName').textContent = t('thName'); $('#thCreator').textContent = t('thCreator'); $('#thAssigned').textContent = t('thAssigned');
    $('#thStatus').textContent = t('thStatus'); $('#thFiles').textContent = t('thFiles'); $('#thFeedback').textContent = t('feedback'); $('#thAssign').textContent = t('thAssign'); $('#thAssignee').textContent = t('thAssignee'); $('#thOps').textContent = t('thOps');
    $('#modalTitle').textContent = ''; // set on open
    $('#lblType').textContent = t('lblType'); $('#lblName').textContent = t('lblName'); $('#lblContent').textContent = t('lblContent'); $('#lblAssigned').textContent = t('lblAssigned'); $('#lblStatus').textContent = t('lblStatus'); $('#lblFiles').textContent = t('lblFiles'); $('#lblAssignee').textContent = t('lblAssignee');
    $('#modalCancel').textContent = t('cancel'); $('#modalSave').textContent = t('save');
    $('#viewClose').textContent = t('close');
    document.getElementById('curMember').textContent = t('cur') + (curMember || '-');
    // Rebuild the status <option> labels from the (possibly switched) locale,
    // preserving the currently selected status value.
    var fs = document.getElementById('fStatus');
    if (fs) {
      var stD = t('st'), curV = fs.value || 'processing';
      fs.innerHTML = Object.keys(stD).map(function(k){ return '<option value="' + k + '">' + stD[k] + '</option>'; }).join('');
      fs.value = curV;
    }
  }
  var $ = function(s){ return document.querySelector(s); };
  var members = [], curMember = '', tasks = [];
  var editing = ''; // task uid being edited ('' = new)
  var editingMember = ''; // member the editing task belongs to
  var editingCreator = ''; // creator of the editing task
  var pendingParentUid = '';    // parent task uid for the next new task ('' = none)
  var pendingAssignee = '';     // default assignee for the next new task
  var pendingFiles = []; // [{name, rel}]
  var myName = '';
  var PAGE_SIZE = 25;
  var taskPage = 1;      // current server-side page
  var taskTotal = 0;     // total records from server

  function paginate(container, data, renderRow, emptyMsg) {
    var state = { page: 1, data: data };
    container._paginate = state;
    function render() {
      var total = state.data.length;
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (state.page > pages) state.page = pages;
      var start = (state.page - 1) * PAGE_SIZE;
      var slice = state.data.slice(start, start + PAGE_SIZE);
      var body = document.createElement('tbody');
      renderRow(body, slice, start);
      var table = container.querySelector('table');
      if (!table) return;
      var old = table.querySelector('tbody');
      if (old) table.replaceChild(body, old); else table.appendChild(body);
      var pag = container.querySelector('.tt-pager');
      if (!pag) { pag = document.createElement('div'); pag.className = 'tt-pager'; container.appendChild(pag); }
      if (total <= PAGE_SIZE) { pag.innerHTML = ''; return; }
      var html = '<span style="font-size:12px;color:#6b7280;margin-right:8px;">' + total + ' items</span>';
      html += '<button data-p="prev" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;font-size:12px;cursor:pointer;">«</button> ';
      for (var p = 1; p <= pages; p++) {
        html += '<button data-p="' + p + '" style="padding:3px 10px;border:1px solid ' + (p===state.page?'#2563eb':'#d5d9df') + ';border-radius:5px;background:' + (p===state.page?'#2563eb':'#fff') + ';color:' + (p===state.page?'#fff':'#334155') + ';font-size:12px;cursor:pointer;margin:0 1px;">' + p + '</button> ';
      }
      html += '<button data-p="next" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;font-size:12px;cursor:pointer;">»</button>';
      pag.innerHTML = html;
      pag.querySelectorAll('button[data-p]').forEach(function(b) {
        b.onclick = function() {
          var v = b.getAttribute('data-p');
          if (v === 'prev') state.page = Math.max(1, state.page - 1);
          else if (v === 'next') state.page = Math.min(pages, state.page + 1);
          else state.page = parseInt(v, 10);
          render();
        };
      });
    }
    render();
  }
  fetch('/api/auth/me').then(function(r){return r.json()}).then(function(d){myName=(d.username||'').toLowerCase(); if (tasks && tasks.length) renderTasks();}).catch(function(){});

  function req(method, url, body) {
    var opt = { method: method, headers: { 'Content-Type': 'application/json' } };
    if (body) opt.body = JSON.stringify(body);
    return fetch(url, opt).then(function(r){ return r.json().catch(function(){ return {}; }); });
  }

  async function loadMembers() {
    try {
      var d = await req('GET', '/api/members');
      members = (d.members || []).map(function(x){ return { id:x.id, name:x.name, admin:x.admin }; });
      // "All" overview for collaboration: show tasks created by every member.
      members.unshift({ id:'', name: lang==='en'?'All':'全部', admin:false });
      var box = $('#memberList'); box.innerHTML = '';
      members.forEach(function(m){
        var el = document.createElement('div');
        el.className = 'member' + (m.id === curMember ? ' active' : '');
        el.textContent = m.name;
        el.onclick = function(){ curMember = m.id; taskPage = 1; loadMembers(); loadTasks(); };
        box.appendChild(el);
      });
      if (curMember === undefined || curMember === null) curMember = '';
      $('#curMember').textContent = t('cur') + (curMember || '-');
      refreshAssigneeOptions();
      loadTasks();
    } catch(e) { console.error('members', e); }
  }

  // Fill the modal's "assignee" dropdown with every real member (the assignee
  // becomes the new task's owner). The pseudo "All" entry (empty id) is skipped.
  function refreshAssigneeOptions(selected) {
    var sel = $('#fAssignee'); if (!sel) return;
    var prev = (selected !== undefined) ? selected : sel.value;
    var opts = members.filter(function(m){ return m.id !== ''; });
    sel.innerHTML = opts.map(function(m){
      return '<option value="' + m.id + '">' + m.name + '</option>';
    }).join('');
    // Keep the current owner selectable even when it is not in the member list
    // (e.g. a deleted instance), so saving never silently re-assigns the task.
    if (prev && !opts.some(function(m){ return m.id === prev; })) {
      var o = document.createElement('option');
      o.value = prev; o.textContent = prev;
      sel.insertBefore(o, sel.firstChild);
    }
    if (prev) sel.value = prev;
    if (!sel.value && curMember) sel.value = curMember;
  }

  var expandedKeys = {}; // task uid -> true when its subtasks are shown

  function taskRowKey(task) { return task.uid || ((task.member || '') + '#' + task.seq); }

  function buildTaskRow(task, depth) {
    var st = t('st');
    var tr = document.createElement('tr');

  function renderTasks() {
    var empty = $('#emptyHint');
    var tableWrap = $('.table-wrap');
    if (!tasks.length) { empty.style.display='block'; empty.textContent = t('empty'); tableWrap.style.display='none'; return; }
    empty.style.display = 'none'; tableWrap.style.display = '';
    // remove old pager (server-side pager uses .tt-pager class)
    var oldPag = tableWrap.querySelector('.tt-pager');
    if (oldPag) oldPag.remove();
    var body = tableWrap.querySelector('tbody');
    body.innerHTML = '';
    var present = {};
    tasks.forEach(function(x){ present[x.uid] = true; });
    tasks.forEach(function(task){
      // A subtask whose parent is shown in this list is rendered inline instead
      // (after expanding the parent); otherwise it stays a normal top-level row.
      if (task.parentUid) {
        if (present[task.parentUid]) return;
      }
      var tr = buildTaskRow(task, 0);
      body.appendChild(tr);
      // Restore any previously expanded state (e.g. after a save reload).
      if (expandedKeys[taskRowKey(task)]) expandSubtasks(tr, task, 0);
    });
    renderServerPager(tableWrap);
  }

  // Fetch and show a task's subtasks inline (as indented rows right below it).
  function toggleSubtasks(tr, task, depth) {
    var key = taskRowKey(task);
    if (expandedKeys[key]) {
      collapseSubtasks(tr);
      delete expandedKeys[key];
      var b = tr.querySelector('button.sub-toggle');
      if (b) { b.textContent = '+'; b.title = t('expand'); }
      return;
    }
    expandedKeys[key] = true;
    expandSubtasks(tr, task, depth);
  }

  function expandSubtasks(tr, task, depth) {
    var key = taskRowKey(task);
    var btn = tr.querySelector('button.sub-toggle');
    if (btn) { btn.textContent = '−'; btn.title = t('collapse'); }
    var member = task.member || curMember || '';
    return fetch('/api/tasks?parentUid=' + encodeURIComponent(task.uid || '') + '&page=1&pageSize=100&_=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        var kids = d.tasks || [];
        if (!kids.length) {
          var ph = document.createElement('tr');
          ph.className = 'sub-child';
          ph.setAttribute('data-for', key);
          ph.innerHTML = '<td></td><td colspan="10" style="color:#9ca3af;font-size:12px;padding:6px 12px;">' + t('noSubTasks') + '</td><td></td>';
          tr.parentNode.insertBefore(ph, tr.nextSibling);
          return ph;
        }
        // Insert children in order; restore each child's own expansion too so a
        // nested expanded subtree stays open after a save reload.
        var chain = Promise.resolve(tr);
        kids.forEach(function(k){
          chain = chain.then(function(prev){
            var kr = buildTaskRow(k, (depth || 0) + 1);
            kr.classList.add('sub-child');
            kr.setAttribute('data-for', key);
            prev.parentNode.insertBefore(kr, prev.nextSibling);
            if (expandedKeys[taskRowKey(k)]) return expandSubtasks(kr, k, (depth || 0) + 1);
            return kr;
          });
        });
        return chain;
      });
  }

  function collapseSubtasks(tr) {
    var n = tr.nextSibling;
    while (n && n.nodeType === 1 && n.classList && n.classList.contains('sub-child')) {
      var k = n.getAttribute('data-key'); if (k) delete expandedKeys[k];
      var next = n.nextSibling;
      n.parentNode.removeChild(n);
      n = next;
    }
  }

  // Server-side pagination: clicking a page button refetches that page from the API.
  function renderServerPager(tableWrap) {
    var pages = Math.max(1, Math.ceil(taskTotal / PAGE_SIZE));
    if (taskPage > pages) taskPage = pages;
    var pag = tableWrap.querySelector('.tt-pager');
    if (!pag) { pag = document.createElement('div'); pag.className = 'tt-pager'; pag.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0;font-size:12px;'; tableWrap.appendChild(pag); }
    if (taskTotal <= PAGE_SIZE) { pag.innerHTML = ''; return; }
    var html = '<span style="font-size:12px;color:#6b7280;margin-right:8px;">' + taskTotal + ' items</span>';
    html += '<button data-p="prev" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;font-size:12px;cursor:pointer;">«</button> ';
    for (var p = 1; p <= pages; p++) {
      html += '<button data-p="' + p + '" style="padding:3px 10px;border:1px solid ' + (p===taskPage?'#2563eb':'#d5d9df') + ';border-radius:5px;background:' + (p===taskPage?'#2563eb':'#fff') + ';color:' + (p===taskPage?'#fff':'#334155') + ';font-size:12px;cursor:pointer;margin:0 1px;">' + p + '</button> ';
    }
    html += '<button data-p="next" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;font-size:12px;cursor:pointer;">»</button>';
    pag.innerHTML = html;
    pag.querySelectorAll('button[data-p]').forEach(function(b) {
      b.onclick = function() {
        var v = b.getAttribute('data-p');
        if (v === 'prev') taskPage = Math.max(1, taskPage - 1);
        else if (v === 'next') taskPage = Math.min(pages, taskPage + 1);
        else taskPage = parseInt(v, 10);
        loadTasks();
      };
    });
  }

  async function loadTasks() {
    var url = curMember ? '/api/tasks?inst=' + encodeURIComponent(curMember) + '&scope=assignment' : '/api/tasks';
    url += (curMember ? '&' : '?') + 'page=' + taskPage + '&pageSize=' + PAGE_SIZE + '&_=' + Date.now();
    var d = await req('GET', url);
    tasks = d.tasks || [];
    if (typeof d.total === 'number') taskTotal = d.total;
    renderTasks();
    refreshTypeDropdown($('#fType').value);
  }

function pagFb2(wrap, es){ var pg={page:1,data:es}; function render(){ var total=pg.data.length; var pages=Math.max(1,Math.ceil(total/PAGE_SIZE)); if(pg.page>pages)pg.page=pages; var s=(pg.page-1)*PAGE_SIZE; var slice=pg.data.slice(s,s+PAGE_SIZE); var b=fbModal2.querySelector("#fb2Body"); b.innerHTML=""; slice.forEach(function(e,i){ var filesHtml=""; if(e.files){ e.files.split(",").filter(Boolean).forEach(function(fn){ var esc=String(fn).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); filesHtml+='<div><a href="javascript:void(0)" class="fb2-file-link" data-f="'+esc+'" style="color:#2563eb;text-decoration:none;font-size:12px;cursor:pointer;">'+esc+'</a></div>'; }); } var tr=document.createElement("tr"); tr.innerHTML='<td style="padding:8px;">'+(total-(s+i))+'</td><td style="padding:8px;">'+(e.content||"")+'</td><td style="padding:8px;">'+(e.by||"")+'</td><td style="padding:8px;">'+(e.time||"")+'</td><td style="padding:8px;">'+filesHtml+'</td>'; b.appendChild(tr); }); b.querySelectorAll("a.fb2-file-link").forEach(function(a){ a.onclick=function(){ openFbFile(a.getAttribute("data-f")); }; }); var pag=wrap.querySelector(".tt-pager2"); if(!pag){pag=document.createElement("div");pag.className="tt-pager2";pag.style.cssText="display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0;";wrap.appendChild(pag);} if(total<=PAGE_SIZE){pag.innerHTML="";return;} var html='<span style="font-size:12px;color:#6b7280;margin-right:8px;">'+total+' items</span><button data-p="prev" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;font-size:12px;cursor:pointer;">«</button> '; for(var p=1;p<=pages;p++){html+='<button data-p="'+p+'" style="padding:3px 10px;border:1px solid '+(p===pg.page?'#2563eb':'#d5d9df')+';border-radius:5px;background:'+(p===pg.page?'#2563eb':'#fff')+';color:'+(p===pg.page?'#fff':'#334155')+';font-size:12px;cursor:pointer;margin:0 1px;">'+p+'</button> ';} html+='<button data-p="next" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;font-size:12px;cursor:pointer;">»</button>'; pag.innerHTML=html; pag.querySelectorAll("button[data-p]").forEach(function(btn){ btn.onclick=function(){ var v=btn.getAttribute("data-p"); if(v==="prev")pg.page=Math.max(1,pg.page-1); else if(v==="next")pg.page=Math.min(pages,pg.page+1); else pg.page=parseInt(v,10); render(); }; }); }
  render();
}
async function saveFeedback2(){ var editor=fbModal2.querySelector("#fb2Editor"); var html=editor.innerHTML.trim(); if(!html||html==="<br>"||html==="<div><br></div>"){ alert(t("fbRequired")); return; } var btn=fbModal2.querySelector("#fb2Save"); var spin=fbModal2.querySelector("#fb2SaveSpin"); var txt=fbModal2.querySelector("#fb2SaveTxt"); var msg=fbModal2.querySelector("#fb2Msg"); btn.disabled=true; btn.style.opacity="0.75"; btn.style.cursor="wait"; spin.style.display="inline-block"; txt.textContent=t("saveDone"); msg.style.display="none"; var fd=new FormData(); fd.append("inst",fb2Inst); fd.append("uid",fb2Uid); fd.append("content",html); for(var i=0;i<fb2PendingFiles.length;i++){ fd.append("files",fb2PendingFiles[i]); } var r=await fetch("/api/feedback",{method:"POST",body:fd}); var d=await r.json().catch(function(){return{};}); if(!d.ok){ spin.style.display="none"; txt.textContent=t("save"); btn.disabled=false; btn.style.opacity="1"; btn.style.cursor="pointer"; alert(d.error||"Failed"); return; } fb2PendingFiles=[]; fbModal2.querySelector("#fb2FileInput").value=""; fbModal2.querySelector("#fb2FileChips").innerHTML=""; await loadFeedback2(); spin.style.display="none"; txt.textContent=t("save"); btn.disabled=false; btn.style.opacity="1"; btn.style.cursor="pointer"; msg.textContent=t("saveOk"); msg.style.color="#16a34a"; msg.style.display="inline-block"; setTimeout(function(){msg.style.display="none";},3000); }
  function closeImgPreview(){ $('#imgPreview').classList.remove('show'); }

  // Preview a file via /api/files/read (returns a base64 dataUri for images),
  // exactly like the file manager. Non-image files prompt to download.
  var PREVIEW_IMG = ['png','jpg','jpeg','gif','bmp','webp','svg','ico','avif'];
  function readFileForPreview(inst, path) {
    var url = withToken('/api/files/read?inst=' + encodeURIComponent(inst));
    return fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ path: path }) })
      .then(function(r){ return r.json().catch(function(){ return {}; }); });
  }
  function openFbFile(fn) {
    TTPreview.open({ insts: [fb2Inst, curMember, 'admin'], path: 'TaskData/Feedback/' + fb2Seq + '/' + fn, name: fn, token: launcherToken });
  }
  function fileUrl(f, member, creator, inline) {
    var name = String(f).split('/').pop();
    var m = member || creator || curMember || '';
    return withToken('/api/files/download?inst=' + encodeURIComponent(m) + '&path=' + encodeURIComponent('TaskData/Doc/' + name) + (inline ? '&inline=1' : ''));
  }
  function openTaskFile(f, member, creator) {
    var name = String(f).split('/').pop();
    TTPreview.open({ insts: [member, creator, curMember, 'admin'], path: 'TaskData/Doc/' + name, name: name, token: launcherToken });
  }
  function renderChips(){
    $('#fileChips').innerHTML = pendingFiles.map(function(f, i){
      var name = String(f).split('/').pop();
      return '<span class="chip"><a href="javascript:void(0)" class="chip-file" data-file="' + String(f).replace(/"/g,'&quot;') + '" style="color:#2563eb;text-decoration:none;">' + name + '</a> <b data-i="'+i+'">×</b></span>';
    }).join('');
    $('#fileChips').querySelectorAll('a.chip-file').forEach(function(a){
      a.onclick = function(){ openTaskFile(a.getAttribute('data-file'), editingMember, editingCreator); };
    });
    $('#fileChips').querySelectorAll('b[data-i]').forEach(function(b){
      b.onclick = function(){ pendingFiles.splice(parseInt(b.getAttribute('data-i'),10),1); renderChips(); };
    });
  }

  async function uploadFiles(files) {
    if (!files || !files.length) return;
    var fd = new FormData();
    fd.append('path', 'TaskData/Doc');
    for (var i=0;i<files.length;i++) fd.append('file', files[i]);
    var r = await fetch('/api/files/upload?inst=' + encodeURIComponent(curMember), { method:'POST', body: fd });
    var d = await r.json().catch(function(){return{};});
    if (!d.ok) { alert(t('errUpload')); return; }
    (d.saved || []).forEach(function(name){ pendingFiles.push('Doc/' + name); });
    renderChips();
  }

  async function saveTask() {
    var assignee = ($('#fAssignee') && $('#fAssignee').value) || curMember || '';
    if (!assignee) { alert(t('errSave')); return; }
    var payload = {
      inst: editing ? editingMember : assignee, uid: editing || undefined,
      newInst: editing ? assignee : undefined,
      name: $('#fName').value.trim(),
      type: $('#fType').value.trim(),
      content: $('#fContent').innerHTML,
      status: $('#fStatus').value,
      assignedAt: ($('#fAssigned').value || '').replace('T', ' '),
      files: pendingFiles,
      parentUid: editing ? undefined : (pendingParentUid || '')
    };
    var method = editing ? 'PUT' : 'POST';
    var d = await req(method, '/api/tasks', payload);
    if (!d.ok) { alert((d.error || t('errSave'))); return; }
    closeModal(); loadTasks();
  }

  // Rich-text image paste: upload the pasted image into TaskData/Doc and insert
  // an <img> pointing at the download endpoint so it persists and renders on all
  // task views. The editor is the #fContent contenteditable box.
  $('#fContent').addEventListener('paste', function (ev) {
    var items = (ev.clipboardData || window.clipboardData).items;
    var imgs = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.type && it.type.indexOf('image/') === 0) imgs.push(it.getAsFile());
    }
    if (!imgs.length) return;    // let default paste proceed for text
    ev.preventDefault();
    var saveBtn = $('#modalSave'); saveBtn.disabled = true;
    var pendingUploads = imgs.length;
    imgs.forEach(function (file) {
      var fd = new FormData();
      fd.append('path', 'TaskData/Doc');
      fd.append('file', file, 'pasted_' + Date.now() + '_' + (file.name || 'image.png'));
      fetch('/api/files/upload?inst=' + encodeURIComponent(curMember), { method: 'POST', body: fd })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d.ok && d.saved && d.saved.length) {
            var rel = 'Doc/' + d.saved[0];
            pendingFiles.push(rel);
            renderChips();
            appendImgToEditor(rel);
          }
        }).catch(function(){})
        .finally(function(){ if (--pendingUploads <= 0) saveBtn.disabled = false; });
    });
  });

  // Rich-text toolbar: map each tool button to a document.execCommand on the
  // editor, keeping focus in the contenteditable box.
  var editor = $('#fContent');
  // Insert an uploaded image into the editor content (appended at the end, which
  // is reliable regardless of focus/selection state), so it shows in the content.
  function appendImgToEditor(rel) {
    var img = document.createElement('img');
    // rel is like "Doc/xxx.png" (relative to TaskData); the file lives under
    // <workspace>/TaskData/, so the download path (relative to workspace root)
    // must include the TaskData/ prefix.
    var downPath = String(rel).replace(/^\/+/, '');
    if (downPath.indexOf('TaskData') !== 0) downPath = 'TaskData/' + downPath;
    img.src = withToken('/api/files/download?inst=' + encodeURIComponent(curMember) + '&path=' + encodeURIComponent(downPath) + '&inline=1');
    img.style.display = 'block';
    img.style.margin = '6px 0';
    editor.appendChild(img);
    // put a paragraph after the image so typing continues below it
    var p = document.createElement('div'); p.appendChild(document.createElement('br'));
    editor.appendChild(p);
  }
  function insertImgUrl(rel) { appendImgToEditor(rel); }
  function uploadAndInsertImg(file) {
    var saveBtn = $('#modalSave'); saveBtn.disabled = true;
    var fd = new FormData();
    fd.append('path', 'TaskData/Doc');
    fd.append('file', file, 'img_' + Date.now() + '_' + (file.name || 'image.png'));
    fetch('/api/files/upload?inst=' + encodeURIComponent(curMember), { method: 'POST', body: fd })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok && d.saved && d.saved.length) { var rel = 'Doc/' + d.saved[0]; pendingFiles.push(rel); renderChips(); appendImgToEditor(rel); }
      }).catch(function(){}).finally(function(){ saveBtn.disabled = false; });
  }
  $('#richToolbar').querySelectorAll('button[data-cmd]').forEach(function (b) {
    b.addEventListener('mousedown', function (ev) { ev.preventDefault(); });   // keep selection
    b.addEventListener('click', function () {
      editor.focus();
      var cmd = b.getAttribute('data-cmd');
      if (cmd === 'formatBlock') document.execCommand(cmd, false, b.getAttribute('data-val'));
      else document.execCommand(cmd, false, null);
      // reflect active state (bold/italic/underline)
      var on = false;
      try { on = document.queryCommandState(cmd); } catch (e) {}
      b.classList.toggle('active', !!on);
    });
  });
  $('#richImage').addEventListener('click', function () {
    editor.focus();
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function () { if (inp.files && inp.files.length) uploadAndInsertImg(inp.files[0]); };
    inp.click();
  });

  // Double-click an image inside the editor to set its displayed width.
  $('#fContent').addEventListener('dblclick', function (ev) {
    var t = ev.target;
    if (t && t.tagName && t.tagName.toUpperCase() === 'IMG') {
      ev.preventDefault();
      var cur = (t.style && t.style.width) || '';
      var val = prompt('设置图片显示宽度 (数字=px，如 400；百分比如 50%；留空=100%)', cur);
      if (val === null) return;
      val = String(val || '').trim();
      if (!val) { t.style.width = ''; return; }
      if (/^\d+(\.\d+)?$/.test(val)) val = val + 'px';       // bare number -> px
      else if (!/%$/.test(val)) val = val + '%';              // treat as % 
      t.style.width = val;
      t.style.height = 'auto';
    }
  });

  $('#addTaskBtn').onclick = function(){
    openModal(null);
  };
  $('#modalCancel').onclick = closeModal;
  $('#viewClose').onclick = closeView;
  $('#imgPreviewClose').onclick = closeImgPreview;
  $('#imgPreview').addEventListener('click', function(ev){ if (ev.target === $('#imgPreview')) closeImgPreview(); });
  $('#modalSave').onclick = saveTask;
  $('#fFiles').onchange = function(){
    var names=[]; for(var i=0;i<this.files.length;i++) names.push(this.files[i].name);
    $('#fFilesLabel').textContent=names.join(', ');
    uploadFiles(this.files).then(function(){ var i=$('#fFiles'); i.value=''; $('#fFilesLabel').textContent=''; }); };
  $('#langSel').onchange = function(){
    lang = norm(this.value);
    try{ localStorage.setItem('tt_lang', lang); document.cookie='tt_lang='+lang+'; path=/; max-age=31536000; SameSite=Lax'; }catch(e){}
    applyBar(); renderTasks();
  };
  try { $('#langSel').value = lang; } catch(e){}

  applyBar();
  loadMembers();
})();
</script>
