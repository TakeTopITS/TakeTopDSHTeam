<script>
// Authenticate same-origin fetches when the launcher opened this page with a
// launcher_token URL (no session cookie is sent inside iframes under SameSite=Lax).
// The launcher middleware already accepts ?launcher_token on every /api/* request,
// so we transparently append it to our own API calls.
(function () {
  var lt = new URLSearchParams(location.search).get('launcher_token');
  if (!lt) return;
  var orig = window.fetch;
  window.fetch = function (url, opts) {
    var u = String(url);
    if (u.indexOf('/api/') === 0) {
      u += (u.indexOf('?') >= 0 ? '&' : '?') + 'launcher_token=' + encodeURIComponent(lt);
    }
    return orig(u, opts || {});
  };
})();
const $ = s => document.querySelector(s);
let logCursor = 0;
let isAdmin = false;
let currentUser = '';
let globalWorkspacePath = '';

// Wrap an async handler so the button shows a spinner + disables while the
// request is in-flight, then restores it. `fn` may return a Promise; the button
// is re-enabled only when it settles. Callback `done(result)` runs if provided.
async function withLoading(btn, fn, done) {
  if (!btn || btn.disabled) { return; }
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span>' + original;
  const startAt = Date.now();
  try {
    const res = await fn();
    if (done) done(res);
    return res;
  } finally {
    // Keep the spinner visible for a minimum so fast operations (start/stop/etc.)
    // still show a clear "working" spinner instead of a blip.
    const remain = 700 - (Date.now() - startAt);
    if (remain > 0) await new Promise(r => setTimeout(r, remain));
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

let LANGS = I18N.en;
function t(key) { return LANGS[key] || key; }

function normLang(code) {
  const c = String(code || '').toLowerCase();
  if (c === 'zh' || c === 'zh-cn' || c === 'zhcn' || c === 'cn') return 'zh';
  if (c === 'en' || c === 'en-us' || c === 'en-gb' || c === 'us') return 'en';
  return c;
}

// The language the user actually selected (persisted as tt_lang cookie/localStorage).
// Used wherever the page renders so it never clobbers the chosen language back to a
// default. Falls back to the first configured language.
function preferredLang() {
  try {
    const cm = document.cookie.match(/(?:^|;\s*)tt_lang=([^;]+)/);
    if (cm) return decodeURIComponent(cm[1]);
  } catch (e) {}
  try { const ls = localStorage.getItem('tt_lang'); if (ls) return ls; } catch (e) {}
  return 'zh';
}

// Display label for a language code used in the dropdown (fallback when the
// config list has no explicit label, e.g. a plain code).
function langLabel(code) {
  const n = normLang(code);
  if (n === 'zh' || n === 'zh-cn') return '中文';
  if (n === 'en') return 'English';
  return code;
}

// Populate the language dropdown with the ordered list from /api/config.
// Languages come from appsettings.json DshWeb.DefaultLanguage as
// "English:en,中文:zh-cn" -> items { label, code }; dropdown shows label, uses code.
// useSaved=true (logged-in page): honor an existing per-visitor choice;
// useSaved=false (login gate): always default to the server's first language.
async function initLangSel(sel, useSaved) {
  let items = [{ label: 'English', code: 'en' }, { label: '中文', code: 'zh-cn' }];
  try {
    const r = await fetch('/api/languages', { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j.languages && j.languages.length) {
        items = j.languages.map((x) => { const code = typeof x === 'string' ? x : String(x.code); return { label: langLabel(code), code: code }; });
      }
    } else {
      // fallback to /api/config for logged-in pages
      const rc = await fetch('/api/config', { cache: 'no-store' });
      if (rc.ok) { const j = await rc.json(); if (j.languages && j.languages.length) items = j.languages.map((x) => { const code = typeof x === 'string' ? x : String(x.code); return { label: langLabel(code), code: code }; }); }
    }
  } catch (e) { }
  sel.innerHTML = items.map((it) => '<option value="' + it.code + '">' + it.label + '</option>').join('');
  // useSaved=true (admin/main page): honor the remembered choice (cookie/localStorage),
  // so the language follows what the user picked. useSaved=false (login gate):
  // ALWAYS use the server-configured FIRST language, so opening the login page
  // shows the admin-selected default (e.g. 中文) regardless of past switches.
  function readLang() {
    try {
      const m = document.cookie.match(/(?:^|;\s*)tt_lang=([^;]+)/);
      if (m) return decodeURIComponent(m[1]);
      return localStorage.getItem('tt_lang');
    } catch (e) { return null; }
  }
  let selVal;
  if (useSaved) {
    const saved = readLang();
    selVal = (saved && items.some((it) => it.code === saved)) ? saved : items[0].code;
  } else {
    selVal = items[0].code;
  }
  sel.value = selVal;
}

function applyLang(lang) {
  LANGS = I18N[normLang(lang)] || I18N.en;
  document.documentElement.lang = lang;
  // static texts
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    // For dshRoot, keep inner span
    if (key === 'dshRoot') {
      el.childNodes[0].nodeValue = t('dshRoot');
      return;
    }
    el.textContent = t(key);
  });
  // placeholders
  document.querySelectorAll('[data-ph]').forEach(el => {
    const key = el.getAttribute('data-ph');
    el.setAttribute('placeholder', t(key));
  });
  // login gate texts (not marked data-i18n because they live under loginGate)
  const lt = $('#loginTitle'); if (lt) lt.textContent = t('loginTitle');
  const ls = $('#loginSub'); if (ls) ls.textContent = t('loginSub');
  const lu = $('#loginUser'); if (lu) lu.placeholder = t('loginUserPh');
  const lp = $('#loginPass'); if (lp) lp.placeholder = t('loginPassPh');
  const lb = $('#loginBtn'); if (lb) lb.textContent = t('loginBtn');
  // keep the two language selectors in sync
  const ls2 = $('#loginLangSel'); if (ls2 && ls2.value !== lang) ls2.value = lang;
  const lsMain = $('#langSelect'); if (lsMain && lsMain.value !== lang) lsMain.value = lang;
  // Re-render dynamic content that depends on the dictionary.
  if (typeof loadInstances === 'function') { try { loadInstances(); } catch (e) { } }

  if (typeof fmLoad === 'function') { try { fmLoad(); } catch (e) { } }
  // Persist the chosen language so login page -> admin page -> DSH stay in sync.
  // Use a cookie (cross-page, cross-navigation) AND localStorage.
  try {
    document.cookie = 'tt_lang=' + encodeURIComponent(lang) + '; path=/; max-age=31536000; SameSite=Lax';
    localStorage.setItem('tt_lang', lang);
  } catch (e) { }
}

async function refresh() {
  const st = await (await fetch('/api/status')).json();
  const on = st.state === 'running';
  $('#dot').className = 'dot ' + (on ? 'running' : 'stopped');
  $('#stateText').textContent = on ? (st.pid ? (t('stateRunningPid') + st.pid + ')') : t('stateRunning')) : t('stateStopped');
  $('#startBtn').disabled = on;
  $('#stopBtn').disabled = !on;
}

async function loadLogs() {
  const r = await (await fetch('/api/logs?from=' + logCursor)).json();
  if (r && Array.isArray(r.logs) && r.logs.length) {
    const box = $('#logs');
    box.textContent += r.logs.join('\n') + '\n';
    box.scrollTop = box.scrollHeight;
    logCursor = r.total;
  }
}

async function loadConfig() {
  const c = await (await fetch('/api/config')).json();
  $('#rootPath').textContent = c.root;
  DshSelfRoot = c.root || '';   // remember this app's own dir (never selectable as workspace)
  $('#cfgUrl').value = c.url;
  $('#extUrl').value = c.externalUrl || '';
  $('#port').value = String(c.url || '').split(':').pop() || 46000;
  // fill the admin "default language" dropdown and preselect the server default
  const langSelEl = $('#defaultLangSel');
  if (langSelEl && Array.isArray(c.languages) && c.languages.length) {
    const items = c.languages.map((x) => { const code = typeof x === 'string' ? x : String(x.code); return { label: langLabel(code), code: code }; });
    langSelEl.innerHTML = items.map((it) => '<option value="' + it.code + '">' + it.label + '</option>').join('');
    langSelEl.value = items[0].code;
    window.__langItems = items;   // remember order for reordering on save
  }
  try {
    const w = await (await fetch('/api/workspace')).json();
    $('#workspace').value = w.workspace || '';
    globalWorkspacePath = w.workspace || '';
  } catch (e) { /* workspace endpoint optional */ }
}

async function init() {
  // ---- "fm" standalone mode: used inside the /work split page's left pane.
  // Render ONLY the file manager, full-width within the pane; skip every card.
  if (location.pathname === '/fm') {
    document.querySelectorAll('.wrap > .card, .wrap > .topbar').forEach(el => { el.style.display = 'none'; });
    $('#fileManagerCard').style.display = '';
    $('#fileManagerCard').style.margin = '0';
    $('#fileManagerCard').style.border = '0';
    $('#fileManagerCard').style.boxShadow = 'none';
    $('#fileManagerCard').style.borderRadius = '0';
    $('#fileManagerCard').style.minHeight = '100vh';
    $('#fileManagerCard').style.padding = '12px 14px';
    // Two tabs in the left pane: File Manager | My Tasks.
    buildFmTabs();
    await checkAuth();
    if (isAdmin) {
      document.querySelectorAll('[data-admin]').forEach(el => el.style.display = 'none');
    }
    // Apply the saved language so the file-manager labels match the rest of the app.
    applyLang(preferredLang());
    $('#myInstanceCard').style.display = 'none';
    try { await initFileManager(); } catch (e) {}
    return;
  }

  $('#startBtn').onclick = () => withLoading($('#startBtn'), async () => {
    const port = parseInt($('#port').value) || 46000;
    logCursor = 0; $('#logs').textContent = '';
    await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ port }) });
    refresh();
  });
  $('#stopBtn').onclick = () => withLoading($('#stopBtn'), async () => { await fetch('/api/stop', { method: 'POST' }); refresh(); });
  $('#saveCfgBtn').onclick = () => withLoading($('#saveCfgBtn'), async () => {
    const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: $('#cfgUrl').value, externalUrl: $('#extUrl').value }) });
    $('#cfgSaved').textContent = (r.ok ? t('saved') : t('saveFail'));
    setTimeout(() => $('#cfgSaved').textContent = '', 1500);
  });
  $('#saveWsBtn').onclick = () => withLoading($('#saveWsBtn'), async () => {
    const v = $('#workspace').value;
    if (isSelfDir(v)) {
      $('#wsSaved').textContent = t('selfDirDenyMsg');
      setTimeout(() => $('#wsSaved').textContent = '', 3000);
      return;
    }
    const r = await fetch('/api/workspace', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ workspace: $('#workspace').value }) });
    $('#wsSaved').textContent = (r.ok ? t('saved') : t('saveFail'));
    setTimeout(() => $('#wsSaved').textContent = '', 1500);
  });
  $('#saveLangBtn').onclick = () => withLoading($('#saveLangBtn'), async () => {
    // Reorder the language list so the selected code becomes the first (default).
    const chosen = $('#defaultLangSel').value;
    const items = (window.__langItems || []).slice();
    const idx = items.findIndex((it) => it.code === chosen);
    let ordered;
    if (idx > 0) {
      const chosenItem = items.splice(idx, 1)[0];
      ordered = [chosenItem].concat(items);
    } else {
      ordered = items;
    }
    // Persist as "显示名:代码" with a canonical display name derived from the
    // code (en->English, zh-cn->中文), so the saved file is always well-formed.
    const raw = ordered.map((it) => langLabel(it.code) + ':' + it.code).join(',');
    const r = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ defaultLanguage: raw }) });
    if (r.ok) {
      $('#langSaved').textContent = t('saved');
      setTimeout(() => $('#langSaved').textContent = '', 1500);
      // apply immediately so the UI (and login gate) reflect the new default
      applyLang(chosen);
      await initLangSel($('#langSelect'), true);
      const loginLS = $('#loginLangSel'); if (loginLS) await initLangSel(loginLS, false);
    } else {
      $('#langSaved').textContent = t('saveFail');
      setTimeout(() => $('#langSaved').textContent = '', 1500);
    }
  });
  $('#checkUpdateBtn').onclick = async () => {
    const btn = $('#checkUpdateBtn');
    const info = $('#verInfo');
    btn.disabled = true;
    info.innerHTML = '<span class="spinner"></span> ' + t('checking');  // show spinner + text
    try {
      const res = await fetch('/api/update', { method: 'GET' });
      const u = await res.json();
      info.textContent = u.latest ? (t('verCur') + u.current + t('verLatest') + u.latest) : (t('verCur') + u.current + t('verNo'));
    } catch (e) {
      info.textContent = t('checkFail') + e.message;
    } finally {
      btn.disabled = false;
    }
  };
  $('#clearLogs').onclick = () => { $('#logs').textContent = ''; logCursor = 0; };

  // browse modal
  $('#browseWsBtn').onclick = () => openBrowse('');
  $('#browseCloseBtn').onclick = () => { $('#browseModal').style.display = 'none'; };
  $('#browseUpBtn').onclick = () => openBrowse($('#browsePath').dataset.parent || '');
  $('#browseSelectBtn').onclick = () => {
    const v = $('#browsePath').value;
    if (isSelfDir(v)) {
      $('#browseList').textContent = t('selfDirDeny');
      return;
    }
    $('#workspace').value = v;
    $('#browseModal').style.display = 'none';
  };

  // language switch (main, logged-in UI): remember personal choice
  const langSel = $('#langSelect');
  await initLangSel(langSel, true);
  langSel.onchange = () => applyLang(langSel.value);
  applyLang(langSel.value);
  // login gate language switch: default = server default (admin-set), so every
  // visitor sees the configured language on first open; they may switch locally.
  // useSaved=true: honor an existing tt_lang so the selected language survives
  // the login page -> admin page transition instead of being reset to default.
  const loginLangSel = $('#loginLangSel');
  if (loginLangSel) {
    await initLangSel(loginLangSel, true);
    loginLangSel.onchange = () => applyLang(loginLangSel.value);
    applyLang(loginLangSel.value);
  }

  // instance manager (admin only)
  $('#createInstBtn').onclick = () => withLoading($('#createInstBtn'), async () => {
    const id = $('#instId').value.trim();
    const ws = $('#instWs').value.trim();
    const pass = $('#instPass').value.trim();
    const msg = $('#instMsg');
    if (!id) { msg.textContent = t('instName') + '?'; msg.className = 'muted err'; return; }
    const r = await fetch('/api/instances', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, name: id, workspace: ws, password: pass }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) {
      msg.textContent = t('instCreated') + ': ' + id;
      msg.className = 'muted ok';
      $('#instId').value = ''; $('#instWs').value = ''; $('#instPass').value = '';
      loadInstances();
    } else {
      msg.textContent = (j.error || t('instError')) + '（' + id + '）';
      msg.className = 'muted err';
    }
  });

  // login / logout
  $('#loginBtn').onclick = doLogin;
  $('#loginPass').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
  $('#logoutBtn').onclick = async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.reload();
  };

  await checkAuth();

  await loadConfig();
  await refresh();
  await loadLogs();
  if ((await fetch('/api/auth/me', { cache: 'no-store' })).ok) {
    try { await loadInstances(); } catch (e) { }
    try { await initFileManager(); } catch (e) { }
  }
  setInterval(() => { refresh(); loadLogs(); }, 1000);
}

async function checkAuth() {
  const r = await fetch('/api/auth/me', { cache: 'no-store' });
  if (r.ok) {
    const me = await r.json();
    // Restore the control page cards (they were hidden while logged out).
    if (location.pathname === '/fm') {
      document.querySelectorAll('.wrap > .card, .topbar').forEach(el => el.style.display = 'none');
      $('#fileManagerCard').style.display = '';
    } else {
      document.querySelectorAll('.wrap > .card, .topbar').forEach(el => el.style.display = '');
      // The file manager moved into the workbench (left pane); hide it on /admin.
      $('#fileManagerCard').style.display = 'none';
    }
    $('#loginGate').style.display = 'none';
    $('#userInfo').textContent = me.username + (me.admin ? ' (admin)' : '');
    isAdmin = me.admin;
    currentUser = me.username;
    $('#logoutBtn').style.display = '';
    $('#changePassBtn').style.display = '';
    // Admin-only cards are hidden for non-admin; show their own instance card.
    document.querySelectorAll('[data-admin]').forEach(el => {
      el.style.display = me.admin ? '' : 'none';
    });
    // "My Instance" card is only for non-admin users (admins use Instance Manager).
    $('#myInstanceCard').style.display = me.admin ? 'none' : '';
    if (!me.admin) {
      loadMyInstance();
    }

    applyLang(preferredLang());
  } else {
    // Not logged in: show login gate, hide main cards.
    $('#loginGate').style.display = 'flex';
    document.querySelectorAll('.wrap > .card, .topbar').forEach(el => el.style.display = 'none');
  }
}

async function doLogin() {
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value;
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
  if (r.ok) { location.href = '/admin'; }
  else { const j = await r.json(); $('#loginMsg').textContent = j.error || '登录失败'; }
}

// ================= My Instance (non-admin) =================
async function loadMyInstance() {
  try {
    const r = await fetch('/api/instances');
    if (!r.ok) return;
    const d = await r.json();
    const inst = (d.instances || [])[0];
    if (!inst) { $('#myInstState').textContent = t('noInstances'); return; }
    window._myInst = inst;
    const running = inst.running;
    $('#myInstDot').className = 'dot ' + (running ? 'running' : 'stopped');
    $('#myInstState').textContent = running ? t('myInstRunning') : t('myInstStopped');
    $('#myInstStartBtn').disabled = false;
    $('#myInstStartBtn').style.display = running ? 'none' : '';
    $('#myInstStopBtn').style.display = running ? '' : 'none';
    $('#myInstOpenBtn').style.display = running ? '' : 'none';
  } catch (e) {}
}
async function myInstStart() {
  const inst = window._myInst;
  if (!inst) return;
  const btn = $('#myInstStartBtn');
  await withLoading(btn, async () => {
    $('#myInstMsg').textContent = '';
    const r = await fetch('/api/instances/' + inst.id + '/start', { method: 'POST' });
    if (!r.ok) { const j = await r.json().catch(() => ({})); $('#myInstMsg').textContent = j.error || t('instError'); return; }
    const j = await r.json().catch(() => ({}));
    if (j.running) { loadMyInstance(); return; }
    // Show a soft hint: the first start of a restricted-user instance can be slow.
    const startHint = document.createElement('div');
    startHint.setAttribute('data-start-hint', '1');
    startHint.style.cssText = 'display:inline-block;background:#1c1e21;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;margin-left:10px;vertical-align:middle;box-shadow:0 2px 8px rgba(0,0,0,.3);';
    startHint.textContent = t('startHint');
    if (btn && btn.parentNode) btn.insertAdjacentElement('afterend', startHint);
    else document.body.appendChild(startHint);
    const clearHint = () => { if (startHint && startHint.parentNode) startHint.parentNode.removeChild(startHint); };
    // Accepted (async). Poll until running (max 120s) so the button stays loading.
    const startMs = Date.now();
    const matchId = (it) => (inst.id && it.id === inst.id) || it.id === currentUser;
    while (Date.now() - startMs < 120000) {
      await new Promise(res => setTimeout(res, 2000));
      try {
        const lr = await fetch('/api/instances');
        if (lr.ok) {
          const ld = await lr.json();
          const it = (ld.instances || []).find(matchId);
          if (it && it.running) { clearHint(); loadMyInstance(); return; }
        }
      } catch (e) { /* transient */ }
    }
    clearHint();
    $('#myInstMsg').textContent = t('timeoutHint');
    loadMyInstance();
  });
}

async function fmRequest(method, url, opts) {
  // Automatically inject the ?inst= parameter for all /api/files/ calls so
  // every file operation targets the correct instance workspace.
  var instParam = new URLSearchParams(location.search).get('inst') || '';
  if (instParam && url.startsWith('/api/files/')) {
    var sep = url.includes('?') ? '&' : '?';
    url += sep + 'inst=' + encodeURIComponent(instParam);
  }
  const r = await fetch(url, Object.assign({ method: method }, opts || {}));
  const j = await r.json().catch(() => ({}));
  return { status: r.status, ok: r.ok, data: j };
}

// Render the logged-in user's assigned tasks (admin may assign to self too).
async function loadMyTasks(container) {
  var dict = { thSeq:'序号', thType:'任务类型', thName:'任务名称', thCreator:'创建者', thAssigned:'分派时间', thStatus:'状态', thFiles:'相关文件', thFeedback:'反馈' };
  var st = { processing:'处理中', done:'完成', cancelled:'取消', pending:'待处理' };
  var lang = preferredLang();
  var lc = String(lang||'').toLowerCase();
  var en = !(lc === 'zh' || lc === 'zh-cn' || lc === 'zhcn' || lc === 'cn');
  if (en) { dict = { thSeq:'No.', thType:'Type', thName:'Name', thCreator:'Created By', thAssigned:'Assigned At', thStatus:'Status', thFiles:'Files', thFeedback:'Feedback' }; st = { processing:'Processing', done:'Done', cancelled:'Cancelled', pending:'Pending' }; }
  try {
    var inst = currentUser || 'admin';
    var tasks = [];
    var total = 0;
    async function fetchPage(p) {
      var d = await (await fetch('/api/tasks?inst=' + encodeURIComponent(inst) + '&page=' + p + '&pageSize=' + PAGE_SIZE)).json();
      tasks = d.tasks || [];
      total = (typeof d.total === 'number') ? d.total : tasks.length;
    }
    await fetchPage(1);
    if (!tasks.length) { container.innerHTML = '<div class="fm-empty">' + (en?'No tasks':'暂无任务') + '</div>'; return; }
    var hdr = '<table class="fm-task-table"><thead><tr><th>' + dict.thSeq + '</th><th>' + dict.thType + '</th><th>' + dict.thName + '</th><th>' + dict.thFeedback + '</th><th>' + dict.thCreator + '</th><th>' + dict.thAssigned + '</th><th>' + dict.thStatus + '</th><th>' + dict.thFiles + '</th></tr></thead></table>';
    container.innerHTML = hdr;
    var state = { page: 1 };
    function renderPage() {
      var tbl = container.querySelector('table');
      var old = tbl.querySelector('tbody'); if (old) old.remove();
      var body = document.createElement('tbody');
      tasks.forEach(function (task) {
        var filesHtml = (task.files||[]).map(function(f){
          var n = String(f).split('/').pop();
          var dl = '/api/files/download?inst=' + encodeURIComponent(inst) + '&path=' + encodeURIComponent('TaskData/Doc/' + n);
          return '<div><a href="' + dl + '" target="_blank" style="color:#2563eb;text-decoration:none;font-size:12.5px;">' + n + '</a></div>';
        }).join('');
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + task.seq + '</td><td>' + (task.type||'') + '</td>'
          + '<td><a href="javascript:void(0)" class="fm-task-name-link" data-task="' + task.seq + '" draggable="true" ondragstart="fmTaskDragStart(event)" style="color:#2563eb;font-weight:600;text-decoration:none;">' + (task.name||'') + '</a></td>'
          + '<td><button class="fm-feedback-btn" data-task="' + task.seq + '" style="padding:2px 10px;border:0;border-radius:5px;background:#2563eb;color:#fff;font-size:12px;cursor:pointer;">' + (en?'Feedback':'反馈') + '</button></td>'
          + '<td>' + (task.createdBy||'') + '</td>'
          + '<td>' + (task.assignedAt||'') + '</td>'
          + '<td><span class="fm-st ' + (task.status||'pending') + '">' + (st[task.status] || st.pending) + '</span></td>'
          + '<td>' + filesHtml + '</td>';
        body.appendChild(tr);
      });
      tbl.appendChild(body);
      container.querySelectorAll('a.fm-task-name-link').forEach(function (a) {
        a.onclick = function (ev) {
          ev.preventDefault();
          var seq = parseInt(a.getAttribute('data-task'), 10);
          var task = tasks.find(function(t){ return t.seq === seq; });
          if (task) showTaskView(task, en);
        };
      });
      container.querySelectorAll('button.fm-feedback-btn').forEach(function (b) {
        b.onclick = function () {
          var seq = parseInt(b.getAttribute('data-task'), 10);
          var task = tasks.find(function(t){ return t.seq === seq; });
          if (task) openFeedback(inst, task, en);
        };
      });
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (state.page > pages) state.page = pages;
      var pag = container.querySelector('.tt-pager');
      if (!pag) { pag = document.createElement('div'); pag.className = 'tt-pager'; pag.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0;font-size:12px;'; container.appendChild(pag); }
      if (total <= PAGE_SIZE) { pag.innerHTML = ''; return; }
      var html = '<span style="color:#6b7280;margin-right:8px;">' + total + ' items</span>';
      html += '<button data-p="prev" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;cursor:pointer;">«</button> ';
      for (var p = 1; p <= pages; p++) {
        html += '<button data-p="' + p + '" style="padding:3px 10px;border:1px solid ' + (p===state.page?'#2563eb':'#d5d9df') + ';border-radius:5px;background:' + (p===state.page?'#2563eb':'#fff') + ';color:' + (p===state.page?'#fff':'#334155') + ';cursor:pointer;margin:0 1px;">' + p + '</button> ';
      }
      html += '<button data-p="next" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;cursor:pointer;">»</button>';
      pag.innerHTML = html;
      pag.querySelectorAll('button[data-p]').forEach(function(b) {
        b.onclick = async function() {
          var v = b.getAttribute('data-p');
          if (v === 'prev') state.page = Math.max(1, state.page - 1);
          else if (v === 'next') state.page = Math.min(pages, state.page + 1);
          else state.page = parseInt(v, 10);
          await fetchPage(state.page);
          renderPage();
        };
      });
    }
    renderPage();
  } catch (e) { container.innerHTML = '<div class="fm-empty">' + (en?'Load failed':'加载失败') + '</div>'; }
}

      if(val === null) return; val = String(val || '').trim();

}
function openFeedback(inst, task, en) {

async function loadFeedback() {
  try {
    var r = await fetch('/api/feedback?inst=' + encodeURIComponent(fbInst) + '&seq=' + fbSeq);
    var d = await r.json().catch(function(){ return {}; });
    var entries = d.entries || [];
    var body = fbModal.querySelector('#fbBody');
    var tableWrap = body.closest('div[style]');
    // remove old pager
    var oldPag = tableWrap.querySelector('.tt-pager');
    if (oldPag) oldPag.remove();
    if (!entries.length) { body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#9ca3af;padding:16px;">' + (fbEn?'No feedback yet':'暂无反馈') + '</td></tr>'; }
    else {
      var now = new Date(); var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      pagFb(tableWrap, entries, today);
    }
  } catch (e) { }
}
function pagFb(wrap, entries, today) {
  var pg = { page: 1, data: entries };
  function render() {
    var total = pg.data.length;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (pg.page > pages) pg.page = pages;
    var s = (pg.page - 1) * PAGE_SIZE;
    var slice = pg.data.slice(s, s + PAGE_SIZE);
    var body = fbModal.querySelector('#fbBody');
    body.innerHTML = '';
    slice.forEach(function(e, i){
      var filesHtml = '';
      if (e.files) { e.files.split(',').filter(Boolean).forEach(function(fn){ filesHtml += '<div><a href="javascript:void(0)" onclick="openFbFile(\'' + fn.replace(/'/g, "\\'") + '\')" style="color:#2563eb;text-decoration:none;font-size:12px;cursor:pointer;">' + fn + '</a></div>'; }); }
      var tr = document.createElement('tr');
      tr.innerHTML = '<td style="padding:8px;">' + (total - (s + i)) + '</td><td style="padding:8px;">' + (e.content||'') + '</td><td style="padding:8px;">' + (e.by||'') + '</td><td style="padding:8px;">' + (e.time||'') + '</td><td style="padding:8px;">' + filesHtml + '</td>';
      body.appendChild(tr);
    });
    var pag = wrap.querySelector('.tt-pager');
    if (!pag) { pag = document.createElement('div'); pag.className = 'tt-pager'; pag.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0;font-size:12px;'; wrap.parentNode.appendChild(pag); }
    var mine = entries.find(function(e){
      var byMatch = (e.by||'').toLowerCase() === (currentUser||'').toLowerCase();
      if (!byMatch) return false;
      if (e.date && e.date === today) return true;
      if (e.time && e.time.slice(0,10) === today) return true;
      return false;
    });
    if (mine) { fbModal.querySelector('#fbEditor').innerHTML = mine.content || ''; }
    if (total <= PAGE_SIZE) { pag.innerHTML = ''; return; }
    var html = '<span style="color:#6b7280;margin-right:8px;">' + total + ' items</span>';
    html += '<button data-p="prev" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;cursor:pointer;">«</button> ';
    for (var p = 1; p <= pages; p++) {
      html += '<button data-p="' + p + '" style="padding:3px 10px;border:1px solid ' + (p===pg.page?'#2563eb':'#d5d9df') + ';border-radius:5px;background:' + (p===pg.page?'#2563eb':'#fff') + ';color:' + (p===pg.page?'#fff':'#334155') + ';cursor:pointer;margin:0 1px;">' + p + '</button> ';
    }
    html += '<button data-p="next" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;cursor:pointer;">»</button>';
    pag.innerHTML = html;
    pag.querySelectorAll('button[data-p]').forEach(function(b) {
      b.onclick = function() {
        var v = b.getAttribute('data-p');
        if (v === 'prev') pg.page = Math.max(1, pg.page - 1);
        else if (v === 'next') pg.page = Math.min(pages, pg.page + 1);
        else pg.page = parseInt(v, 10);
        render();
      };
    });
  }
  render();
}

// ---- File viewer ----
function fmViewerOpen() { $('#viewerModal').style.display = 'flex'; }

function fmGuessLang(ext) {
  const map = { '.js':'javascript','.ts':'typescript','.jsx':'javascript','.tsx':'typescript','.json':'json',
    '.html':'html','.htm':'html','.css':'css','.xml':'xml','.yml':'yaml','.yaml':'yaml','.md':'markdown',
    '.py':'python','.java':'java','.c':'c','.h':'c','.cpp':'cpp','.cs':'csharp','.go':'go','.rs':'rust',
    '.rb':'ruby','.php':'php','.sh':'bash','.bash':'bash','.bat':'dos','.ps1':'powershell','.sql':'sql',
    '.ini':'ini','.toml':'ini','.conf':'ini','.txt':'plaintext','.log':'plaintext','.csv':'plaintext' };
  return map[ext] || 'plaintext';
}

async function fmOpenFile(path, name) {
  const extRaw = (name.split('.').pop() || '').toLowerCase();
  const ext = extRaw ? '.' + extRaw : '';
  // Files we can preview inline; everything else is downloaded to the OS app.
  if (!fmCanPreview(extRaw)) { fmDownloadFile(path, name); return; }
  const res = await fmRequest('POST', '/api/files/read', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
  if (!res.ok) { fmNote(res.data.error || t('fileError'), true); return; }
  const d = res.data;
  $('#viewerTitle').textContent = name;
  const body = $('#viewerBody');
  fmViewerOpen();
  if (d.type === 'image') {
    body.innerHTML = '<div style="display:flex;justify-content:center;padding:10px;"><img id="viewerImg" style="max-width:100%;max-height:70vh;" src="' + escp(d.dataUri || '') + '" alt="' + escp(name) + '" /></div>';
    return;
  }
  const lang = fmGuessLang(ext);
  if (ext === '.md' || ext === '.markdown') {
    body.innerHTML = '<div id="viewerMd" class="fm-md"></div>';
    $('#viewerMd').innerHTML = marked.parse(d.content || '');
    body.style.background = '#fff';
    return;
  }
  body.innerHTML = '<pre><code id="viewerCode" class="language-' + escp(lang) + '" style="white-space:pre;overflow:auto;">' + escp(d.content || '') + '</code></pre>';
  try { hljs.highlightElement($('#viewerCode')); } catch (e) { }
}

// Which extensions the built-in viewer can render inline.
function fmCanPreview(ext) {
  if (!ext) return false;
  const img = ['png','jpg','jpeg','gif','bmp','webp','svg','ico'];
  const text = ['txt','log','md','markdown','csv','ini','json','yml','yaml','xml','html','htm','css','js','mjs','cjs','ts','tsx','jsx','py','java','c','h','cpp','hpp','cs','go','rs','rb','php','sh','bash','sql','bat','ps1','conf','toml','env','properties','gitignore'];
  return img.includes(ext) || text.includes(ext);
}

// Trigger a browser download of a non-previewable file via /api/files/download.
// Asks first, so clicking "打开" never downloads without explicit consent.
function fmDownloadFile(path, name) {
  if (!confirm((t('fileAskDownload') || '下载') + ': ' + name + '?')) return;
  const a = document.createElement('a');
  a.href = '/api/files/download?path=' + encodeURIComponent(path);
  a.download = name || '';
  document.body.appendChild(a);
  a.click();
  a.remove();
  fmNote(t('fileDownloaded'));
}

function fmNote(text, isErr) {

}

function escp(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

var PAGE_SIZE = 25;
function paginateBox(container, data, renderRow, emptyMsg, extraClass) {
  var state = { page: 1, data: data };
  var cls = extraClass || 'tt-pager';
  function render() {
    var total = state.data.length;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * PAGE_SIZE;
    var slice = state.data.slice(start, start + PAGE_SIZE);

    var pag = container.querySelector('.' + cls);
    if (!pag) { pag = document.createElement('div'); pag.className = cls; pag.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 0;font-size:12px;'; container.appendChild(pag); }
    if (total <= PAGE_SIZE) { pag.innerHTML = ''; return; }
    var html = '<span style="color:#6b7280;margin-right:8px;">' + total + ' items</span>';
    html += '<button data-p="prev" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;cursor:pointer;">«</button> ';
    for (var p = 1; p <= pages; p++) {
      html += '<button data-p="' + p + '" style="padding:3px 10px;border:1px solid ' + (p===state.page?'#2563eb':'#d5d9df') + ';border-radius:5px;background:' + (p===state.page?'#2563eb':'#fff') + ';color:' + (p===state.page?'#fff':'#334155') + ';cursor:pointer;margin:0 1px;">' + p + '</button> ';
    }
    html += '<button data-p="next" style="padding:3px 10px;border:1px solid #d5d9df;border-radius:5px;background:#fff;cursor:pointer;">»</button>';
    pag.innerHTML = html;
    pag.querySelectorAll('button[data-p]').forEach(function(b) {
      b.onclick = function() {
        var v = b.getAttribute('data-p');
        if (v === 'prev') state.page = Math.max(1, state.page - 1);
        else if (v === 'next') state.page = Math.min(pages, state.page + 1);
        else state.page = parseInt(v, 10);
        render();
      };
    });
  }
  render();
}

function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(1) + ' GB';
}

async function fmLoad() {
  const box = $('#fmList');
  const moving = !!fmMoveSrc;
  // Move mode: show only the current directory's sub-dirs (navigate to pick a target).
  if (moving) {
    $('#fmMoveHint').textContent = (t('fileMoveTo') || '移动到') + ': ' + (fmMoveSrc.name || '') + ' → /' + fmPath;
    const res = await fmRequest('GET', '/api/files/list?path=' + encodeURIComponent(fmPath));
    box.innerHTML = fmRenderMove(res.ok ? (res.data.entries || []) : []);
    bindDirBehavior(box, true);
    return;
  }
  // Non-move: render the FULL tree from the workspace root (Explorer-style).
  // Only `fmExpanded` dirs reveal their children; everything stays visible.
  fmRoot = null;
  // Ensure children for every expanded dir are cached so the tree renders fully.
  for (const key of fmExpanded) {
    if (!fmExpandCache.has(key)) await fmPrefetchNested(key);
  }
  const rootRes = await fmRequest('GET', '/api/files/list?path=');
  if (!rootRes.ok) { fmNote(rootRes.data.error || t('fileError'), true); return; }
  fmRoot = rootRes.data.root;
  $('#fmPwd').textContent = '/' + (fmPath || '');
  box.innerHTML = fmRenderTree(rootRes.data.entries || [], '');
  bindDirBehavior(box, false);
}

// Recursively render the full tree (dirs first), expanding only dirs in fmExpanded.
function fmRenderTree(entries, prefix) {
  let html = '';
  for (const e of entries) {
    const fpath = prefix ? prefix + '/' + e.name : e.name;
    html += fmRenderRow(e, fpath, prefix);
    if (e.type === 'dir' && fmExpanded.has(fpath)) {
      const kids = fmExpandCache.get(fpath);
      if (kids && kids.length > 0) {
        html += fmRenderTree(kids, fpath);
      } else {
        // Empty directory: show a placeholder ".." at the appropriate indent.
        const depth = prefix === '' ? 1 : prefix.split('/').length + 1;
        html += '<div class="fm-row fm-empty" data-empty="1" style="padding-left:' + (depth * 22) + 'px;">'
             + '<span class="fm-name muted">📄 ..</span></div>';
      }
    }
  }
  return html;
}

function fmRenderRow(e, fpath, parentPrefix) {
  const isDir = e.type === 'dir';
  const icon = isDir ? '📁' : '📄';
  const size = isDir ? '' : ' <span class="muted">' + fmtSize(e.size) + '</span>';
  const isExpanded = isDir && fmExpanded.has(fpath);
  const glyph = isDir ? (isExpanded ? '-' : '+') : '';   // +/- collapse toggle
  const openAct = isDir
    ? '<button class="fm-act" data-act="open" disabled title="' + t('fmOpen') + '">' + t('fmOpen') + '</button>'
    : '<button class="fm-act" data-act="open" title="' + t('fmOpen') + '">' + t('fmOpen') + '</button>';
  const rowDepth = parentPrefix === '' ? 0 : parentPrefix.split('/').length;
  const pad = rowDepth > 0 ? 'padding-left:' + (rowDepth * 22) + 'px;' : '';
  return rowHtml(icon, e.name, fpath, e.type, size,
    { style: pad, glyph: glyph, actions: openAct
      + '<button class="fm-act" data-act="zip" title="' + t('fmZip') + '">' + t('fmZip') + '</button>'
      + (isDir ? '' : (/\.zip$/i.test(e.name) ? '<button class="fm-act" data-act="unzip" title="' + t('fmUnzip') + '">' + t('fmUnzip') + '</button>' : ''))
      + '<button class="fm-act" data-act="rename" title="' + t('fmRename') + '">' + t('fmRename') + '</button>'
      + '<button class="fm-act" data-act="move" title="' + t('fmMove') + '">' + t('fmMove') + '</button>'
      + '<button class="fm-act fm-danger" data-act="delete" title="' + t('fmDelete') + '">' + t('fmDelete') + '</button>' });
}

function bindDirBehavior(box, moving) {
  box.querySelectorAll('.fm-row .fm-act').forEach(btn => {
    btn.onclick = (ev) => { ev.stopPropagation(); fmAction(btn.dataset.act, btn.closest('.fm-row')); };
  });
  // Clicking the +/- glyph toggles expansion WITHOUT selecting the dir.
  box.querySelectorAll('.fm-row .fm-glyph').forEach(g => {
    const row = g.closest('.fm-row');
    if (row && row.dataset.type === 'dir' && g.textContent.trim() !== '') {
      g.onclick = (ev) => { ev.stopPropagation(); fmAction('expand', row); };
    }
  });
  box.querySelectorAll('.fm-row.fm-dir').forEach(row => {
    row.onclick = () => {
      const path = row.dataset.path || '';
      if (moving) { fmMoveEnterPath(path); return; }
      // Explorer-style: clicking a dir selects it (becomes the upload/current dir).
      fmPath = path;
      $('#fmPwd').textContent = '/' + (fmPath || '');
    };
  });
}

function rowHtml(icon, name, fpath, type, size, extra) {
  const glyph = extra && extra.glyph;
  return '<div class="fm-row fm-' + type + '" data-path="' + escp(fpath) + '" data-type="' + type + '" data-name="' + escp(name) + '"'
       + ' draggable="true" ondragstart="fmDragStart(event)" style="' + (extra && extra.style || '') + '">'
       + '<span class="fm-name"><span class="fm-glyph" data-glyph="1">' + (glyph || '\u00a0') + '</span>' + icon + ' ' + escp(name) + '</span>' + (size || '')
       + '<span class="fm-actions">' + (extra && extra.actions || '') + '</span></div>';
}
// Allow dragging a file row from the file-manager pane into the DSH composer,
// transferring the file's path/name so the DSH prompt can reference it.
function fmDragStart(ev) {
  const row = ev.target.closest('.fm-row');
  if (!row) return;
  const path = row.dataset.path || '';
  const name = row.dataset.name || '';
  try { ev.dataTransfer.setData('text/plain', path); } catch (e) {}
  try { ev.dataTransfer.setData('application/x-tt-fm-path', path); } catch (e) {}
  try { ev.dataTransfer.setData('application/x-tt-fm-name', name); } catch (e) {}
  try { ev.dataTransfer.effectAllowed = 'copy'; } catch (e) {}
}
// Allow dragging a task name from the "My Tasks" list into the DSH composer.
function fmTaskDragStart(ev) {
  const link = ev.target.closest('.fm-task-name-link');
  if (!link) return;
  const name = (link.textContent || '').trim();
  try { ev.dataTransfer.setData('text/plain', name); } catch (e) {}
  try { ev.dataTransfer.setData('application/x-tt-fm-name', name); } catch (e) {}
  try { ev.dataTransfer.effectAllowed = 'copy'; } catch (e) {}
}

// Move mode: show current dir's sub-directories to pick a target.
function fmRenderMove(entries) {
  let html = '';
  if (fmPath) html += '<div class="fm-row fm-dir" data-path="" data-type="dir"><span>📁 ..</span></div>';
  for (const e of entries) {
    if (e.type !== 'dir') continue;
    html += '<div class="fm-row fm-dir" data-pick="1" data-path="' + escp(fmPath ? fmPath + '/' + e.name : e.name) + '" data-type="dir">'
         + '<span class="fm-name">📁 ' + escp(e.name) + '</span></div>';
  }
  return html;
}

// Recursively prefetch children of any dir in fmExpanded (and their nested ones).
async function fmPrefetchNested(dirPath) {
  const stack = [dirPath];
  while (stack.length) {
    const p = stack.pop();
    if (fmExpandCache.has(p)) continue;
    const rr = await fmRequest('GET', '/api/files/list?path=' + encodeURIComponent(p));
    const entries = rr.ok ? (rr.data.entries || []) : [];
    fmExpandCache.set(p, entries);
    for (const e of entries) {
      if (e.type === 'dir' && fmExpanded.has(p ? p + '/' + e.name : e.name)) stack.push(p ? p + '/' + e.name : e.name);
    }
  }
}

async function fmAction(act, row) {
  const path = row.dataset.path;
  const name = row.dataset.name;
  const type = row.dataset.type;
  if (act === 'open' && type === 'file') { fmOpenFile(path, name); return; }
  if (act === 'expand' && type === 'dir') {
    if (fmExpanded.has(path)) {
      fmExpanded.delete(path);
    } else {
      fmExpanded.add(path);
      // Prefetch children (and any nested expanded dirs) for the tree.
      if (!fmExpandCache.has(path)) {
        const rr = await fmRequest('GET', '/api/files/list?path=' + encodeURIComponent(path));
        fmExpandCache.set(path, rr.ok ? (rr.data.entries || []) : []);
      }
      await fmPrefetchNested(path);
    }
    fmLoad(); return;
  }
  if (act === 'delete') {
    if (!confirm(t('fileDeleteConfirm') + ' ' + name + '?')) return;
    const res = await fmRequest('POST', '/api/files/delete', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
    if (res.ok) { fmNote(t('fileDeleted')); await fmLoad(); } else fmNote(res.data.error || t('fileError'), true);
  } else if (act === 'rename') {
    const n = prompt(t('fileRenameTo'), name);
    if (!n || n === name) return;
    const parent = fmPath ? fmPath + '/' : '';
    const res = await fmRequest('POST', '/api/files/rename', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path, newPath: parent + n }) });
    if (res.ok) { fmNote(t('fileRenamed')); await fmLoad(); } else fmNote(res.data.error || t('fileError'), true);
  } else if (act === 'move') {
    fmMoveEnter({ path: path, name: name });
  } else if (act === 'zip') {
    const res = await fmRequest('POST', '/api/files/zip', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
    if (res.ok) { fmNote(t('fileZipped')); await fmLoad(); } else fmNote(res.data.error || t('fileError'), true);
  } else if (act === 'unzip') {
    const res = await fmRequest('POST', '/api/files/unzip', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
    if (res.ok) { fmNote(t('fileUnzipped')); await fmLoad(); } else fmNote(res.data.error || t('fileError'), true);
  }
}

// Helper used by "new folder": rename relative to current dir (creates dir).
async function fmRename(src, name, createDir) {
  const parent = fmPath ? fmPath + '/' : '';
  const target = parent + name;
  if (createDir) {
    // create a placeholder file then delete it? Instead create dir via mkdir on server.
    const res = await fmRequest('POST', '/api/files/mkdir', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: target }) });
    if (res.ok) { fmNote(t('fileCreated')); await fmLoad(); } else fmNote(res.data.error || t('fileError'), true);
  }
}

// ---- Instance manager ----
async function loadInstances() {
  try {
    const r = await fetch('/api/instances');
    const data = await r.json();
    console.log('[LIST] api response:', JSON.stringify(data));
    const box = $('#instList');
    box.textContent = '';
    const list = data.instances || [];
    console.log('[LIST] count:', list.length, 'ids:', list.map(i => i.id));
    if (!list.length) { box.innerHTML = '<div class="muted">' + t('noInstances') + '</div>'; return; }
    try {
    var hdrHtml = '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
    hdrHtml += '<thead><tr style="background:#f5f6f8;">'
         + '<th style="padding:6px 8px;text-align:left;">' + t('thUser') + '</th>'
         + '<th style="padding:6px 8px;text-align:left;">' + t('thPort') + '</th>'
         + '<th style="padding:6px 8px;text-align:left;">' + t('thWs') + '</th>'
         + '<th style="padding:6px 8px;text-align:left;">' + t('thState') + '</th>'
         + '<th style="padding:6px 8px;text-align:left;">' + t('thOps') + '</th>'
         + '</tr></thead></table>';
    box.innerHTML = hdrHtml;
    paginateBox(box, list, function(container, slice, startIdx) {
      var tbl = container.querySelector('table');
      var old = tbl.querySelector('tbody'); if (old) old.remove();
      var body = document.createElement('tbody');
      for (var idx = 0; idx < slice.length; idx++) {
        var i = slice[idx];
        const stateColor = i.running ? '#16a34a' : '#6b7280';
        var tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid #eee';
        tr.innerHTML = '<td style="padding:6px 8px;font-weight:600;">' + esc(i.id) + '</td>'
             + '<td style="padding:6px 8px;">' + i.dshPort + '</td>'
             + '<td style="padding:6px 8px;">' + esc(i.workspace) + '</td>'
             + '<td style="padding:6px 8px;color:' + stateColor + ';">' + (i.running ? t('instRunning') : t('instStopped')) + '</td>'
             + '<td style="padding:6px 8px;white-space:nowrap;">';
        if (i.running) {
          tr.innerHTML += '<button class="secondary" onclick="instOpen(\'' + esc(i.id) + '\')">' + t('instOpen') + '</button> ';
          tr.innerHTML += '<button class="secondary" onclick="instStop(this,\'' + esc(i.id) + '\')">' + t('instStop') + '</button> ';
        } else {
          tr.innerHTML += '<button onclick="instStart(this,\'' + esc(i.id) + '\')">' + t('instStart') + '</button> ';
        }
        if (isAdmin) {
          tr.innerHTML += '<button class="danger" onclick="instDelete(this,\'' + esc(i.id) + '\')">' + t('instDelete') + '</button>';
          tr.innerHTML += ' <button class="secondary" onclick="showResetPassModal(\'' + esc(i.id) + '\')">' + t('resetPass') + '</button>';
        }
        tr.innerHTML += '</td>';
        body.appendChild(tr);
      }
      tbl.appendChild(body);
    }, t('noInstances'));
    } catch (renderErr) { console.error('[LIST] render error:', renderErr); box.textContent = 'render error: ' + renderErr.message; }
  } catch (e) { console.error('[LIST] fetch error:', e); $('#instList').textContent = t('instError') + ': ' + e.message; }
}
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function updateInstWs() {
  const u = ($('#instId').value || '').trim();
  const ws = $('#instWs');
  if (u && globalWorkspacePath) {
    ws.value = globalWorkspacePath.replace(/\\/g, '/').replace(/\/+$/, '') + '/' + u;
    ws.placeholder = globalWorkspacePath + '/' + u;
  } else {
    ws.value = '';
    ws.placeholder = t('instWsPh');
  }
}
function instStart(btn, id) { return withLoading(btn, async () => {
  const r = await fetch('/api/instances/' + id + '/start', { method: 'POST' });
  if (!r.ok) { const j = await r.json().catch(() => ({})); alert(j.error || t('instError')); return; }
  const j = await r.json().catch(() => ({}));
  if (j.running) { loadInstances(); return; }
  // Show a soft hint: the first start of a restricted-user instance can be slow.
  const startHint = document.createElement('div');
  startHint.setAttribute('data-start-hint', '1');
  startHint.style.cssText = 'display:inline-block;background:#1c1e21;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;margin-left:10px;vertical-align:middle;box-shadow:0 2px 8px rgba(0,0,0,.3);';
  startHint.textContent = t('startHint');
  // Place the hint right AFTER the clicked button.
  if (btn && btn.parentNode) btn.insertAdjacentElement('afterend', startHint);
  else document.body.appendChild(startHint);
  const clearHint = () => { if (startHint && startHint.parentNode) startHint.parentNode.removeChild(startHint); };
  // Accepted (async). Poll until running (max 120s) so the button stays loading.
  const startMs = Date.now();
  // Match by the requested id, or by the logged-in user's bound instance when the
  // id is blank/unknown (defensive): we must not break early and leave the UI on
  // "已停止" while the instance is actually starting.
  const matchId = (it) => (id && it.id === id) || it.id === currentUser;
  let lastState = null;
  while (Date.now() - startMs < 120000) {
    await new Promise(res => setTimeout(res, 2000));
    try {
      const lr = await fetch('/api/instances');
      if (lr.ok) {
        const ld = await lr.json();
        const it = (ld.instances || []).find(matchId);
        if (it) {
          lastState = !!it.running;
          if (it.running) { clearHint(); loadInstances(); return; }
        }
      }
    } catch (e) { /* transient */ }
  }
  clearHint();
  loadInstances();
}); }
function instStop(btn, id) { return withLoading(btn, async () => {
  const r = await fetch('/api/instances/' + id + '/stop', { method: 'POST' });
  if (!r.ok) { const j = await r.json().catch(() => ({})); alert(j.error || t('instError')); }
  loadInstances();
}); }
async function instOpen(id) {
  // Open the split workspace page: left = this user's file manager, right = DSH.
  // Still same-origin via the launcher proxy so the DSH language injection works.
  try {
    const st = await fetch('/api/session-token');
    if (st.ok) {
      const d = await st.json();
      window.location.href = '/work?inst=' + encodeURIComponent(id) + '&launcher_token=' + encodeURIComponent(d.token);
      return;
    }
  } catch (e) { }
  // fallback: direct open
  const r = await fetch('/api/instances/' + id + '/open');
  if (r.ok) { const d = await r.json(); window.location.href = d.url; }
  else { window.location.href = '/'; }
}
async function openWithToken() {
  try {
    const r = await fetch('/api/session-token');
    if (r.ok) {
      const d = await r.json();
      // Split workspace page (no ?inst → default/own instance on the right pane).
      window.location.href = '/work?launcher_token=' + encodeURIComponent(d.token);
    } else {
      window.location.href = '/';
    }
  } catch (e) { window.location.href = '/'; }
}


function instDelete(btn, id) {
  if (!confirm('Delete ' + id + '?')) return;
  return withLoading(btn, async () => {
    const r = await fetch('/api/instances/' + id, { method: 'DELETE' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) alert(j.error || t('instError'));
    await loadInstances();
  });
}

// ---- Password change / reset ----
function openPassModal(title, showOld, targetUser) {
  $('#passModalTitle').textContent = title;
  $('#passOldRow').style.display = showOld ? '' : 'none';
  $('#passTargetUser').value = targetUser || '';
  $('#passOld').value = '';
  $('#passNew').value = '';
  $('#passConfirm').value = '';
  $('#passMsg').textContent = '';
  $('#passModal').style.display = 'flex';
}
$('#passModalClose').onclick = () => { $('#passModal').style.display = 'none'; };
$('#changePassBtn').onclick = () => openPassModal(t('changePassTitle'), true, '');
$('#passSaveBtn').onclick = async () => {
  const target = $('#passTargetUser').value;
  const np = $('#passNew').value;
  const cp = $('#passConfirm').value;
  const op = $('#passOld').value;
  if (np !== cp) { $('#passMsg').textContent = t('passMismatch'); return; }
  if (np.length < 6) { $('#passMsg').textContent = '密码至少6位'; return; }
  let r;
  if (target) {
    // admin reset
    r = await fetch('/api/admin/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: target, newPassword: np }) });
  } else {
    // user change own password
    if (!op) { $('#passMsg').textContent = t('oldPass') + '?'; return; }
    r = await fetch('/api/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oldPassword: op, newPassword: np }) });
  }
  const j = await r.json();
  if (j.ok) { $('#passModal').style.display = 'none'; alert(target ? t('resetPassDone') : t('passChanged')); }
  else { $('#passMsg').textContent = j.error || t('passChangeFail'); }
};
function showResetPassModal(username) { openPassModal(t('resetPassTitle') + ': ' + username, false, username); }

// Render the server directory listing inside the modal.
let browseRoots = [];
let DshSelfRoot = '';   // this app's own install dir; never allow selecting it.

function normPath(p) { return (p || '').replace(/\\/g, '/').replace(/\/+$/, ''); }
function isSelfDir(p) {
  if (!DshSelfRoot || !p) return false;
  const t = normPath(p), s = normPath(DshSelfRoot);
  return t === s || t.startsWith(s + '/');
}

async function openBrowse(path) {
  $('#browseModal').style.display = 'flex';
  $('#browseList').textContent = t('loading');
  $('#browseBreadcrumb').textContent = '';
  // Pass the instance id (if any) so the server defaults to its workspace.
  var instParam = new URLSearchParams(location.search).get('inst') || '';
  var instQs = instParam ? '?inst=' + encodeURIComponent(instParam) : '';
  if (!path) {
    try {
      const r = await (await fetch('/api/browse' + instQs)).json();
      browseRoots = r.roots || [];
    } catch (e) { browseRoots = []; }
    renderBrowseRoots();
    return;
  }
  await loadBrowseDir(path);
}

function renderBrowseRoots() {
  const list = $('#browseList');
  list.textContent = '';
  if (!browseRoots.length) { list.textContent = t('noRoots'); return; }
  for (const root of browseRoots) {
    if (isSelfDir(root.path)) continue;   // never offer this app's own dir
    const row = document.createElement('button');
    row.textContent = root.name + '  [' + root.path + ']';
    row.style.cssText = 'display:block;width:100%;text-align:left;padding:8px;margin:2px 0;border:1px solid #e0e2e6;border-radius:6px;background:#fff;color:#1c1e21;cursor:pointer;';
    row.onclick = () => loadBrowseDir(root.path);
    list.appendChild(row);
  }
}

async function loadBrowseDir(path) {
  // Refuse to navigate into this app's own directory.
  if (isSelfDir(path)) {
    $('#browseList').textContent = t('selfDirDeny');
    $('#browseBreadcrumb').textContent = path;
    return;
  }
  $('#browseList').textContent = t('loading');
  $('#browsePath').value = path;
  try {
    const r = await (await fetch('/api/browse?path=' + encodeURIComponent(path))).json();
    $('#browsePath').value = r.path;
    $('#browsePath').dataset.parent = r.parent || '';
    $('#browseBreadcrumb').textContent = r.path;
    const list = $('#browseList');
    list.textContent = '';
    if (r.entries && r.entries.length) {
      for (const e of r.entries) {
        if (isSelfDir(e.path)) continue;   // hide this app's own dir from the tree
        const row = document.createElement('button');
        row.textContent = '📁 ' + e.name + '  [' + e.path + ']';
        row.style.cssText = 'display:block;width:100%;text-align:left;padding:8px;margin:2px 0;border:1px solid #e0e2e6;border-radius:6px;background:#fff;color:#1c1e21;cursor:pointer;';
        row.onclick = () => loadBrowseDir(e.path);
        list.appendChild(row);
      }
    } else {
      list.textContent = t('noSub');
    }
  } catch (e) {
    $('#browseList').textContent = t('cannotRead') + e.message;
  }
}
// Load the launcher's own app version and show it in the browser tab title.
async function initVersion() {
  try {
    const r = await fetch('/api/version');
    if (!r.ok) return;
    const d = await r.json();
    // "TakeTopDSH Team Launcher v1.0.0" in the tab title (not on the page).
    document.title = (document.title || 'TakeTopDSH Team Launcher') + ' v' + (d.version || '1.0.0');
  } catch (e) {}
}
initVersion();
init();
