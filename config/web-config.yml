# Web界面配置
# 该配置文件用于设置DeepSeek Harness的Web界面

# 服务器配置
server:
  # 监听地址
  host: "0.0.0.0"
  # 监听端口
  port: 46000
  # 是否启用HTTPS
  https: false
  # HTTPS证书路径（如果启用）
  # cert: "/path/to/cert.pem"
  # key: "/path/to/key.pem"

# 认证配置
auth:
  # 是否启用认证
  enabled: false
  # 认证方式: "api_key" | "token" | "oauth"
  method: "api_key"
  # API密钥（如果使用api_key方式）
  api_key: "ph-demo-placeholder-key-change-me"
  # Token过期时间（秒）
  token_expiry: 86400

# 会话配置
session:
  # 会话存储路径
  storage_path: "./sessions"
  # 会话超时时间（秒）
  timeout: 3600
  # 最大并发会话数（多人同时使用）
  max_concurrent: 50
  # 是否启用会话持久化
  persistence: true

# 共享数据配置（多人协作经验数据）
shared_data:
  # 共享数据目录
  path: "./sharedata"
  # 是否启用共享数据
  enabled: true
  # 共享数据同步间隔（秒）
  sync_interval: 30
  # 共享数据类型
  types:
    - "skills"        # 技能数据
    - "prompts"       # 提示词模板
    - "code_snippets" # 代码片段
    - "best_practices" # 最佳实践
    - "project_context" # 项目上下文

# Agent配置
agent:
  # 默认Agent预设
  default_preset: "multi-agent"
  # 可用的Agent预设列表
  available_presets:
    - "standard"
    - "multi-agent"
    - "coordinator"
    - "developer"
    - "reviewer"
    - "tester"
    - "documenter"
  # Agent执行配置
  execution:
    # 最大并发Agent数
    max_concurrent: 5
    # Agent超时时间（秒）
    timeout: 300
    # 是否启用后台Agent
    background_enabled: true

# 工作区配置
workspace:
  # 默认工作区路径（由管理页配置，这里留空）
  default_path: ""
  # 是否允许访问工作区外的文件
  allow_external_access: false
  # 受保护的路径列表（禁止Agent访问）
  protected_paths:
    - ".git"
    - "node_modules"
    - ".vs"

# 日志配置
logging:
  # 日志级别: "debug" | "info" | "warn" | "error"
  level: "info"
  # 日志存储路径
  path: "./logs"
  # 是否启用控制台日志
  console: true
  # 是否启用文件日志
  file: true
  # 日志文件最大大小（MB）
  max_size: 100
  # 保留的日志文件数量
  max_files: 10

# 插件配置
plugins:
  # 是否启用插件系统
  enabled: true
  # 插件存储路径
  path: "./plugins"
  # 自动加载的插件列表
  auto_load: []

# 安全配置
security:
  # 是否启用沙箱模式
  sandbox_enabled: true
  # 沙箱类型: "local" | "docker" | "remote"
  sandbox_type: "local"
  # 命令白名单（允许执行的命令）
  command_whitelist:
    - "dotnet"
    - "git"
    - "npm"
    - "pnpm"
    - "node"
  # 命令黑名单（禁止执行的命令）
  command_blacklist:
    - "rm -rf"
    - "format"
    - "del"

# 性能配置
performance:
  # 是否启用缓存
  cache_enabled: true
  # 缓存大小（MB）
  cache_size: 1000
  # 是否启用压缩
  compression_enabled: true
  # 最大请求大小（MB）
  max_request_size: 50

# 监控配置
monitoring:
  # 是否启用监控
  enabled: true
  # 监控端口
  port: 46001
  # 是否启用指标收集
  metrics: true
  # 是否启用健康检查
  health_check: true